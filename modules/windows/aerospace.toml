# GENERATED WRAPPER — templated by modules/windows/default.nix. The @TOKENS@
# below are filled from haus._apps (the resolved app roster) and the resolved
# home path at build time; don't deploy this file directly. Everything OUTSIDE
# the tokens is the static, hand-tuned AeroSpace config.

# Opt into AeroSpace's config schema v2. Its one behaviour change: the workspace
# roster is no longer INFERRED from the right-hand sides of the keybindings
# (upstream calls that inference error-prone and froze it at v1) — it's declared
# below instead. Omitting this line means v1.
config-version = 2

# Every workspace haus can reach, declared rather than inferred: the
# numbered ones (how many is haus.windows.numberedWorkspaces) plus each roster
# app's workspace (Ghostty's T included), generated
# from haus._apps. Same members v1 inferred from the chords, so the set no
# longer changes as a side effect of which bindings happen to exist — a
# workspace stays on the roster even when a keymap ("none") binds nothing to it.
persistent-workspaces = [@PERSISTENT_WS@]

after-login-command = []

# Re-sort once the daemon is up: the startup on-window-detected rule below can
# only say 'T' (TOML can't derive a workspace from a title), so zmx lane
# windows — whose page is T/<repo>, read off their forced lane title — land
# on bare T at every AeroSpace (re)start until resort-windows.sh puts them
# back. The same script the leader's ` runs by hand.
after-startup-command = ['exec-and-forget @HOME@/.config/aerospace/resort-windows.sh']

# Two hooks: the bar's trigger, and the workspace-MRU push (the recency file
# behind page-aware `caps t` and pounce's ⌃⇥ page walk). AeroSpace runs the
# entries as ONE argv, not two commands, so they ride a shell -c.
exec-on-workspace-change = [
    '/bin/bash',
    '-c',
    '"@HOME@/.config/sketchybar/aerospace-notify.sh"; "@HOME@/.config/aerospace/workspace-mru.sh" push',
]

start-at-login = false

enable-normalization-flatten-containers = true
enable-normalization-opposite-orientation-for-nested-containers = true

# How much of its neighbours an accordion workspace leaves showing.
accordion-padding = @ACCORDION_PADDING@

# What a fresh workspace does with its windows, and which way its first split
# runs. Defaults, not locks: the layout chords still switch the current
# workspace either way.
default-root-container-layout = '@DEFAULT_LAYOUT@'

default-root-container-orientation = '@DEFAULT_ORIENTATION@'

# The pointer half is empty unless it should follow focus, and is two hooks
# rather than one: the second alone would leave the pointer behind whenever
# focus moves between two windows on the same display, which is most of the
# time. Both are lazy re-centres, so nothing moves while the pointer is already
# inside whatever took focus.
#
# on-focus-changed carries one more thing when the ai room is on — lane-seen.sh,
# which takes a lane's parked trill fin down once you are looking at its window.
# Focus between two windows of ONE app is a thing only the tiler sees, and two
# lanes are both Ghostty.
on-focus-changed = [@FOCUS_CHANGED@]
on-focused-monitor-changed = [@MONITOR_CHANGED@]
automatically-unhide-macos-hidden-apps = true

# What a key NAME below means physically, from haus.keys.layout. Empty on
# "qwerty", which is AeroSpace's own default and so needs no block at all — a
# machine that never set the option gets these comment lines and not one changed
# binding. It has to sit here, after the last root-level key and before the first
# table, because everything below is inside one.
@KEY_MAPPING@
[gaps]
inner.horizontal = [{ monitor."Built-in Retina Display" = @GAP_BUILTIN@ }, @GAP_EXTERNAL@]
inner.vertical = [{ monitor."Built-in Retina Display" = @GAP_BUILTIN@ }, @GAP_EXTERNAL@]
outer.left = [{ monitor."Built-in Retina Display" = @GAP_BUILTIN@ }, @GAP_EXTERNAL@]
outer.bottom = @GAP_OUTER_BOTTOM@
outer.top = @GAP_OUTER_TOP@
outer.right = [{ monitor."Built-in Retina Display" = @GAP_BUILTIN@ }, @GAP_EXTERNAL@]

[mode.main.binding]

# All possible keys:
# - Letters.        a, b, c, ..., z
# - Numbers.        0, 1, 2, ..., 9
# - Keypad numbers. keypad0, keypad1, keypad2, ..., keypad9
# - F-keys.         f1, f2, ..., f20
# - Special keys.   minus, equal, period, comma, slash, backslash, quote, semicolon,
#                   backtick, leftSquareBracket, rightSquareBracket, space, enter, esc,
#                   backspace, tab
# - Keypad special. keypadClear, keypadDecimalMark, keypadDivide, keypadEnter, keypadEqual,
#                   keypadMinus, keypadMultiply, keypadPlus
# - Arrows.         left, down, up, right

# All possible modifiers: cmd, alt, ctrl, shift

# All possible commands: https://nikitabobko.github.io/AeroSpace/commands

# Static tiling / workspace / layout / palette bindings — generated from
# modules/windows/wm-bindings.nix, the SAME table that renders the pounce
# cheatsheet, so a binding and its caption can't drift. The modifier every one of
# them hangs off is haus.keys.windowNav (⌥ by default):
# layouts <mod>/ <mod>,, fullscreen <mod>f,
# move-workspace <mod>⇧⇥, palette per keys.palette. <mod>⇥ is deliberately
# unbound — workspace back-and-forth is retired in favour of pounce's
# cross-workspace ⌘⇥ switcher, and <mod>hjkl is unbound too since focusing by
# direction moved to the leader's arrows and haus binds no Vim direction by
# default any more. Resizing is a leader action
# (tap the leader, then -/=), and so is everything that names a WORKSPACE:
# the leader then a digit/letter focuses it, the leader then ⇧+that same key
# throws the focused window there and follows, ⌥⇧+it throws and stays — see
# [mode.launch.binding] below, next to
# the app launchers. windowNav = "none" renders this block and the service-mode
# entry empty. (Careful: never write a token's own name in this file's prose —
# substitution is blind to comments and would inject the generated bindings
# mid-sentence.)
@MAIN_STATIC@
# Leader: enters `launch` mode -> letter -> open app (the launcher letters live in
# [mode.launch.binding] below, generated from haus._apps). Generated from
# haus.keys.leader: "caps" binds f18, because AeroSpace can't bind Caps Lock
# itself and haus hidutil-remaps it (see modules/windows/default.nix);
# "alt-space" binds that instead and leaves Caps Lock alone; "none" emits nothing.
@LEADER_ENTRY@
# The palette, <mod>f, <mod>⇥ and <mod>⇧⇥ are part of the generated static block
# above (modules/windows/wm-bindings.nix). Only the mode-entry chords are generated
# here — they're structural plumbing, not tiling commands, so they aren't on the
# cheatsheet.
@SERVICE_ENTRY@
# Service-mode bindings (flatten, float, close-others, join-with, volume) —
# generated from modules/windows/wm-bindings.nix, same table as the cheatsheet.
[mode.service.binding]
@SERVICE_STATIC@
# Launch leader mode (entered by tapping caps -> F18). Each letter launches or
# focuses its app, then drops back to main. esc / any unbound key + esc to
# bail out without launching anything.
[mode.launch.binding]
esc = ['exec-and-forget @HOME@/.config/sketchybar/plugins/launch_mode.sh off', 'mode main']
slash = ['exec-and-forget @HOME@/.config/sketchybar/plugins/launch_mode.sh off', 'exec-and-forget @BIN@/pounce --cheatsheet ~/.config/pounce/cheatsheet.json', 'mode main']
# The numbered workspaces, generated from haus.windows.numberedWorkspaces (they
# were written out as 1-4 here until the count became an option). Each gets
# three rows: the digit focuses it off the same leader — caps then a digit,
# exactly like caps then a letter jumps to an app's workspace — ⇧+the digit
# THROWS the focused window there AND follows it (--focus-follows-window), and
# ⌥⇧+it throws without following. The ⇧/⌥⇧ pair is the same rule the workspace
# keys below use, so "go there", "take this there" and "send this there" are one
# modifier apart rather than on three unrelated chords. Follow is the ⇧ default
# because throwing without it left you staring at the hole the window came out
# of; staying is the deliberate variant, for sending something away and carrying
# on.
@LAUNCH_DIGITS@
# Non-launch leader actions. v = clipboard history; f = Find Files (pounce's
# Spotlight-style file/folder search); z = reopen last closed app (the browser
# ⌘⇧T analog — relaunch the most recently quit app; press again to walk back);
# , = macOS System Settings (mirrors the ⌘, "preferences" convention); . =
# advance the focused workspace's tiling mode one stop (columns -> grid ->
# accordion -> columns, one-shot each press — see tiling-mode.sh); ` = re-sort
# every window to its workspace.
# (Palette is on cmd+space now, so the old space->palette leader is gone.)
#
# The emoji grid used to sit on `e` here. It doesn't any more: haus binds a bare
# Fn/Globe tap to mode:emoji (modules/launcher — haus.launcher.items."mode:emoji"),
# which is one key instead of two and is where a Mac user already reaches for it.
# Two bindings for one picker only cost a leader letter, so the leader gave it up
# rather than the Fn key; `f` is what took the slot.
#
# v and f go through `pounce run mode:<name>` — pounce's one dispatch grammar,
# the same string that keys haus.launcher.items and the same closure a pounce
# hotkey fires. So the leader row and an item binding are now literally the same
# address, and the flags they used to call (`pounce --clipboard`) are gone from
# pounce entirely. It's also a shorter-lived client: RUN acknowledges and exits
# instead of holding a socket open for as long as the picker is on screen.
v = ['exec-and-forget @HOME@/.config/sketchybar/plugins/launch_mode.sh off', 'exec-and-forget @BIN@/pounce run mode:clipboard', 'mode main']
f = ['exec-and-forget @HOME@/.config/sketchybar/plugins/launch_mode.sh off', 'exec-and-forget @BIN@/pounce run mode:filesearch', 'mode main']
z = ['exec-and-forget @HOME@/.config/sketchybar/plugins/launch_mode.sh off', 'exec-and-forget @HOME@/.config/aerospace/reopen-last-app.sh', 'mode main']
comma = ['exec-and-forget @HOME@/.config/sketchybar/plugins/launch_mode.sh off', 'exec-and-forget open -b com.apple.systempreferences', 'mode main']
period = ['exec-and-forget @HOME@/.config/sketchybar/plugins/launch_mode.sh off', 'exec-and-forget @HOME@/.config/aerospace/tiling-mode.sh', 'mode main']
backtick = ['exec-and-forget @HOME@/.config/sketchybar/plugins/launch_mode.sh off', 'exec-and-forget @HOME@/.config/aerospace/resort-windows.sh', 'mode main']
# - / = resize the focused tiled window (growing it shrinks its neighbour). The
# first press also drops into `resize` mode so further -/= repeat without re-tapping caps.
minus = ['exec-and-forget @HOME@/.config/sketchybar/plugins/launch_mode.sh off', 'exec-and-forget @HOME@/.config/sketchybar/plugins/resize_mode.sh on', 'resize smart -50', 'mode resize']
equal = ['exec-and-forget @HOME@/.config/sketchybar/plugins/launch_mode.sh off', 'exec-and-forget @HOME@/.config/sketchybar/plugins/resize_mode.sh on', 'resize smart +50', 'mode resize']
# Arrows drop into `navigate` mode: focus that direction and stay there, so
# further arrows keep moving focus without re-tapping caps. ⇧+arrow MOVES the
# focused window instead (the replacement for the old hyper move chord). esc /
# enter (in navigate mode) return to main.
left = ['exec-and-forget @HOME@/.config/sketchybar/plugins/launch_mode.sh off', 'exec-and-forget @HOME@/.config/sketchybar/plugins/navigate_mode.sh on', 'focus left', 'mode navigate']
down = ['exec-and-forget @HOME@/.config/sketchybar/plugins/launch_mode.sh off', 'exec-and-forget @HOME@/.config/sketchybar/plugins/navigate_mode.sh on', 'focus down', 'mode navigate']
up = ['exec-and-forget @HOME@/.config/sketchybar/plugins/launch_mode.sh off', 'exec-and-forget @HOME@/.config/sketchybar/plugins/navigate_mode.sh on', 'focus up', 'mode navigate']
right = ['exec-and-forget @HOME@/.config/sketchybar/plugins/launch_mode.sh off', 'exec-and-forget @HOME@/.config/sketchybar/plugins/navigate_mode.sh on', 'focus right', 'mode navigate']
shift-left = ['exec-and-forget @HOME@/.config/sketchybar/plugins/launch_mode.sh off', 'exec-and-forget @HOME@/.config/sketchybar/plugins/navigate_mode.sh on', 'move left', 'mode navigate']
shift-down = ['exec-and-forget @HOME@/.config/sketchybar/plugins/launch_mode.sh off', 'exec-and-forget @HOME@/.config/sketchybar/plugins/navigate_mode.sh on', 'move down', 'mode navigate']
shift-up = ['exec-and-forget @HOME@/.config/sketchybar/plugins/launch_mode.sh off', 'exec-and-forget @HOME@/.config/sketchybar/plugins/navigate_mode.sh on', 'move up', 'mode navigate']
shift-right = ['exec-and-forget @HOME@/.config/sketchybar/plugins/launch_mode.sh off', 'exec-and-forget @HOME@/.config/sketchybar/plugins/navigate_mode.sh on', 'move right', 'mode navigate']
# App launcher letters — generated from haus._apps.
@LAUNCH_LETTERS@
# Workspace throws (⇧+the workspace's own key to follow, ⌥⇧+it to stay) —
# generated from haus._workspaces. Only workspaces that set `key` get them, and
# there is deliberately no bare-key focus: that namespace belongs to the roster's
# launcher letters, one of which usually doubles as "open something here".
@LAUNCH_MOVES@
# Resize mode (entered via the launch leader's -/=, or by pressing -/= while
# navigating). Repeat -/= to keep growing/shrinking the focused tiled window;
# arrows flow straight into navigate mode without re-tapping caps; esc/enter
# return to main. Each *_mode.sh `on` clears the sibling indicator's state
# itself — one script call per transition, so the front-app pill can't race.
[mode.resize.binding]
minus = 'resize smart -50'
equal = 'resize smart +50'
left = ['exec-and-forget @HOME@/.config/sketchybar/plugins/navigate_mode.sh on', 'focus left', 'mode navigate']
down = ['exec-and-forget @HOME@/.config/sketchybar/plugins/navigate_mode.sh on', 'focus down', 'mode navigate']
up = ['exec-and-forget @HOME@/.config/sketchybar/plugins/navigate_mode.sh on', 'focus up', 'mode navigate']
right = ['exec-and-forget @HOME@/.config/sketchybar/plugins/navigate_mode.sh on', 'focus right', 'mode navigate']
shift-left = ['exec-and-forget @HOME@/.config/sketchybar/plugins/navigate_mode.sh on', 'move left', 'mode navigate']
shift-down = ['exec-and-forget @HOME@/.config/sketchybar/plugins/navigate_mode.sh on', 'move down', 'mode navigate']
shift-up = ['exec-and-forget @HOME@/.config/sketchybar/plugins/navigate_mode.sh on', 'move up', 'mode navigate']
shift-right = ['exec-and-forget @HOME@/.config/sketchybar/plugins/navigate_mode.sh on', 'move right', 'mode navigate']
esc = ['exec-and-forget @HOME@/.config/sketchybar/plugins/resize_mode.sh off', 'mode main']
enter = ['exec-and-forget @HOME@/.config/sketchybar/plugins/resize_mode.sh off', 'mode main']

# Navigate mode (entered via the launch leader's arrows, or by pressing an
# arrow while resizing). Arrows keep moving focus; ⇧+arrow moves the focused
# window in that direction (replacing the old ⌘⌥⌃⇧ hyper move chord); -/=
# flows straight into resize mode without re-tapping caps; esc/enter return
# to main.
[mode.navigate.binding]
left = 'focus left'
down = 'focus down'
up = 'focus up'
right = 'focus right'
shift-left = 'move left'
shift-down = 'move down'
shift-up = 'move up'
shift-right = 'move right'
minus = ['exec-and-forget @HOME@/.config/sketchybar/plugins/resize_mode.sh on', 'resize smart -50', 'mode resize']
equal = ['exec-and-forget @HOME@/.config/sketchybar/plugins/resize_mode.sh on', 'resize smart +50', 'mode resize']
esc = ['exec-and-forget @HOME@/.config/sketchybar/plugins/navigate_mode.sh off', 'mode main']
enter = ['exec-and-forget @HOME@/.config/sketchybar/plugins/navigate_mode.sh off', 'mode main']

# Ghostty routing. Title matching races window detection (the AX title lands
# after the window is mapped), so popup windows (peek, rebuild) used to get
# tiled for a beat — reflowing the whole workspace — before any float rule
# could win. Instead: every ghostty window spawned at runtime floats (floating
# never reflows the tiles), and regular terminal windows tile themselves onto
# workspace T from inside terminal's scripts/launch.sh, which knows what it is with
# certainty. At aerospace (re)start, existing windows go straight to T tiled,
# same as before. (Ghostty belongs to haus.workspaces.T but its window
# rules are bespoke, so the generated auto-assign block below skips it — see
# ../options.nix' `titleRegex` for why a generated rule can't just replace
# this: the same startup-window race would hit it too.)
[[on-window-detected]]
if.app-id = 'com.mitchellh.ghostty'
if.during-aerospace-startup = true
run = 'move-node-to-workspace T'

[[on-window-detected]]
if.app-id = 'com.mitchellh.ghostty'
run = 'layout floating'

# App window auto-assignment — generated from haus._workspaces via
# haus._appWorkspace.
@WINDOW_RULES@
# Always-float apps (haus.roster.*.float) — generated from
# haus._apps. FaceTime and Trill are declared this way in
# modules/windows/default.nix; a host can add its own the same way instead of
# hand-editing this file.
@FLOAT_RULES@
