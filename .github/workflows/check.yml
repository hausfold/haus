name: check

on:
  push:
    branches: [main]
  pull_request:
  # Let a branch be checked on demand (e.g. before opening a PR) without
  # having to push to main first.
  workflow_dispatch:

jobs:
  eval:
    name: eval the example host
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: DeterminateSystems/nix-installer-action@main
      # Pure evaluation of the full darwin system — catches syntax errors, bad
      # option names, and broken module wiring before any consumer does. (Eval
      # is platform-independent; no macOS runner needed until we *build*.)
      # aarch64 only: nixpkgs 26.11 dropped x86_64-darwin, so there's no Intel
      # example left to eval (see flake.nix `allSystems`).
      - run: nix eval .#darwinConfigurations.example.system.drvPath
      # The pure-lib checks are declared for Linux too precisely so they can run
      # HERE — five of them now: theme-variants and keymap pin the
      # flavor/contrast → themes-subdir and keys.* → chord/glyph tables,
      # data-only-surface fails on a package-typed option a data-only rice
      # cannot set, and packs / preset-composition pin what happens when two
      # rices MEET (a pack against a host, every pair of the presets). All five
      # mirror a rule that lives in another repo, in a generated dotfile, or in a
      # README — where drift is silent. Without this line they were declared and
      # never executed. The darwin-only checks (presets, accent-reach,
      # scale-reach, font-reach) fingerprint a real evaluated system, so they
      # stay guarded and don't run here — they fire on a Mac, by hand, or not at
      # all.
      - run: nix flake check
      # The annotated host template (hosts/<host>/options.nix) ships every
      # option's DEFAULT as a line you can uncomment. host-template.nix's own
      # build already proves the file parses both as-shipped and uncommented;
      # this proves the uncommented values are LEGAL for their options — a
      # `defaultText` that has drifted from the real default (wrong type, a
      # stale enum member) parses fine and only fails on the machine of whoever
      # uncomments that one line, months later. `…` placeholders are the
      # deliberately-not-pasteable ones and are excluded, exactly as the
      # derivation's own check does.
      - name: every default in the host template is settable
        run: |
          tmpl=$(nix build --no-link --print-out-paths .#host-template)
          host=$(mktemp -d)
          printf '{ ... }:\n\n{\n  imports = [ ./options.nix ];\n}\n' > "$host/default.nix"
          sed -E 's/^  # (nebelhaus\.)/  \1/' "$tmpl/share/nebelhaus/host-options.nix" \
            | grep -v '= …;$' > "$host/options.nix"
          nix eval --impure --apply 'x: x.system.drvPath' --expr \
            "(builtins.getFlake \"path:$PWD\").mkNebelhaus { username = \"ada\"; hostname = \"lovelace\"; host = $host; }"

  shellcheck:
    name: shell scripts
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      # bootstrap.sh is the standalone curl|bash installer — the one shell
      # script here that isn't a nix template (@PLACEHOLDER@ substitution) or a
      # zsh sketchybar plugin, so it's the one we can lint as-is. Warning level
      # catches real bugs (undefined vars, bad quoting) without failing on
      # info-level style nits. It's what nebelhaus.com/init.sh serves, so a
      # regression here reaches every new installer.
      - name: shellcheck
        run: |
          sudo apt-get update && sudo apt-get install -y shellcheck bats
          # bootstrap.sh reaches every new installer via nebelhaus.com/init.sh;
          # haus.sh + awake.sh ship onto every machine as end-user CLIs.
          # statusline-refresh.sh is linted for a different reason: it runs
          # DETACHED with its output discarded, so a non-zero anywhere in it is
          # completely invisible — the bar just quietly stops updating.
          shellcheck --severity=warning bootstrap.sh modules/den/haus.sh modules/den/awake.sh modules/den/statusline-refresh.sh test/awake.sh
      - name: awake lifecycle tests
        run: bash test/awake.sh
      # The refresher is `holt`'s reader, and it fails in the one way nobody sees:
      # it runs detached under `set -e`, so any non-zero leaves the LAST panel.tsv
      # in place and the bar keeps showing worktrees that were reaped hours ago —
      # no error, no empty bar, just a confidently stale one. Same hermetic shape
      # as holt's own acceptance suite (throwaway repos, shim gh, redirected cache).
      - name: statusline refresher tests
        run: bats test/statusline-refresh.bats
      # The render path's counterpart suite. Its subject is the Fable/Mythos row
      # tint, whose correctness is a WIDTH invariant across rows that carry both
      # SGR and OSC 8 — so it breaks silently whenever a segment is added, and
      # the breakage reads as a terminal quirk rather than a bug. Same hermetic
      # shape again; needs only git + jq + bats.
      - name: statusline render tests
        run: bats test/statusline.bats
