name: release

# Tag v<date> (CalVer, e.g. v2026.07.18) -> a GitHub release of haus. The tag is what
# hausfold.co/hacker.sh (and ?ref=) resolve to for a pinned installer; haus
# itself is consumed as a flake input, so there's no build artifact to attach —
# the release is just a named, reviewed point in the history.
#
# Cut tags with `bench release haus` from the workshop; it enforces that the
# tag matches VERSION and that everything is pushed first.

on:
  push:
    tags: ["v*"]

permissions:
  contents: write

# One run per tag. GitHub can deliver a single tag push as two `push` events;
# both runs would evaluate, and the second would die on `gh release create`
# against the release the first just published. The queue holds the twin until
# the first run ends, and `gate` then finds the release there and skips every
# job after it, so the twin finishes green having done nothing. Finish a red
# release with `gh run rerun --failed`, which keeps gate's first answer, unless
# a twin of it ran: a twin queued behind a red run finds no release and
# publishes it, so look at the tag's other run before re-running this one.
concurrency:
  group: release-${ github.ref }
  cancel-in-progress: false

jobs:
  gate:
    name: tag not yet released
    runs-on: ubuntu-latest
    permissions:
      contents: read
    outputs:
      fresh: ${ steps.check.outputs.fresh }
    steps:
      - id: check
        env:
          GH_TOKEN: ${ github.token }
        run: |
          if gh release view "$GITHUB_REF_NAME" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            echo "::notice::$GITHUB_REF_NAME is already released; this is a duplicate run, nothing to do"
            echo "fresh=false" >> "$GITHUB_OUTPUT"
          else
            echo "fresh=true" >> "$GITHUB_OUTPUT"
          fi

  release:
    name: publish release
    needs: gate
    if: needs.gate.outputs.fresh == 'true'
    runs-on: ubuntu-latest
    # Same ceiling as check.yml's jobs, for the same reason: this one evaluates
    # the example host too, so it inherits every way that step can hang — and a
    # release job that sits at "running" for GitHub's six-hour default is a tag
    # nobody can tell has failed.
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - name: Check the tag matches VERSION
        run: |
          VERSION="$(tr -d '[:space:]' < VERSION)"
          if [ "v$VERSION" != "$GITHUB_REF_NAME" ]; then
            echo "tag $GITHUB_REF_NAME != VERSION $VERSION — bump VERSION or retag" >&2
            exit 1
          fi

      # The workshop's docs/ci.md scopes release workflows out of its speed
      # rules and says rule 4 is not one of them: a tag publishes something that
      # cannot be withdrawn, so a third-party action floating on `@main` is
      # worse here than on a gate, not excused. Pinned by swapping to what every
      # other nix job in the family runs — check.yml's `eval` job is this same
      # action at this same version, on this same runner, running the exact
      # command below. Nothing the daemon installer set up was reachable from
      # here anyway: this job builds nothing, so the multi-user store and the
      # daemon went unused, and a pure eval asks a substituter for nothing.
      - uses: nixbuild/nix-quick-install-action@v35
      # Same pure eval as check.yml — never cut a release that doesn't evaluate.
      - run: nix eval .#darwinConfigurations.example.system.drvPath

      - name: Create GitHub release
        run: gh release create "$GITHUB_REF_NAME" --generate-notes --verify-tag
        env:
          GH_TOKEN: ${{ github.token }}
