# Generated by workshop/script/issue-templates.sh — edit the generator, not this.
#
# The four blocks below are the PR body's four blocks, on purpose: an issue
# filled in this way IS the PR body, written before the work instead of after.
# A lane picks it up and lands a PR whose body is this one with Verify ticked.
name: Task
description: Work we've already decided to do — the spec a lane picks up
labels: ["task"]
body:
  - type: markdown
    attributes:
      value: |
        For work that's already decided. Reporting a problem? Use **Bug
        report**. Suggesting something? Use **Idea**. Both of those become one
        of these after triage.
  - type: textarea
    id: what
    attributes:
      label: What
      description: The change, in the imperative. One sentence if it can be.
    validations:
      required: true
  - type: textarea
    id: why
    attributes:
      label: Why
      description: What's wrong today. Link the bug or idea this came from.
    validations:
      required: true
  - type: textarea
    id: verify
    attributes:
      label: Verify
      description: The exact commands or clicks that prove it works, in order. Whoever feel-tests this later has only this list.
      placeholder: |
        - [ ] `bench try switch`, then …
    validations:
      required: true
  - type: textarea
    id: watchout
    attributes:
      label: Watch out
      description: Blast radius. Other repos, other lanes, anything that has to land first or ripple after.
    validations:
      required: false
