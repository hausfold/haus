name: check

on:
  push:
    branches: [main]
  pull_request:
  # Let a branch be checked on demand (e.g. before opening a PR) without
  # having to push to main first.
  workflow_dispatch:

jobs:
  eval:
    name: eval the example host
    runs-on: ubuntu-latest
    # A ceiling, not a target: this job runs in ~2 minutes. It exists because
    # GitHub's default is SIX HOURS, and a step that hangs rather than fails
    # sits there burning the whole budget while the PR shows "running" — which
    # is exactly what happened on 2026-08-18, when the shellcheck job's
    # `apt-get update` stalled on the Azure Ubuntu mirrors and had to be
    # cancelled by hand after two hours.
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: DeterminateSystems/nix-installer-action@main
      # Pure evaluation of the full darwin system — catches syntax errors, bad
      # option names, and broken module wiring before any consumer does. (Eval
      # is platform-independent; no macOS runner needed until we *build*.)
      # aarch64 only: nixpkgs 26.11 dropped x86_64-darwin, so there's no Intel
      # example left to eval (see flake.nix `allSystems`).
      - run: nix eval .#darwinConfigurations.example.system.drvPath
      # The platform-independent checks are declared for Linux too precisely so
      # they can run HERE — TWELVE of them, everything in flake.nix's `checks`
      # before the `optionalAttrs (hasSuffix "-darwin" system)` line, which is
      # the only thing that decides the split and the only place to re-derive
      # this list from:
      #
      #   room-registry            registry vs the evaluated option tree
      #   data-only-surface        a package-typed option a data-only file can't set
      #   packs                    what happens when a pack MEETS a host
      #   pounce-item-grammar      modules/launcher/item-grammar.nix vs the LOCKED
      #                            pounce's ItemSettings.swift, so a prefix that
      #                            app learns can't spend a day being refused
      #                            here as a typo
      #   keymap                   keys.* → chord/glyph tables
      #   alert-volume             the beep-volume ladder
      #   accessibility-surface    classify_key's `effective` arm, sed'd out of
      #                            modules/core/haus.sh, vs modules/lib/reachability.nix
      #                            — the one copy of those key names a shell script
      #                            cannot import, and the one whose going stale
      #                            would make `haus diff` verify a new option
      #                            against the PLIST instead of NSWorkspace
      #   theme-variants           flavor/contrast → themes-subdir
      #   site-data-current        docs/site-data/ vs the derivation the site reads
      #   bar-rc-executable       the rc files' +x bit
      #   bar-plugins-executable  the plugins' +x bit
      #   wallpaper                the odd one out: it BUILDS the generated
      #                            desktop and asserts its size and colour count,
      #                            the only automated thing that can notice the
      #                            dither stopped reaching the 8-bit reduction
      #
      # All but the last mirror a rule that lives in another repo, in a generated
      # dotfile, in a shell script, or in a README — where drift is silent.
      # Without this line they were declared and never executed.
      #
      # Keep this census honest when a check is added: it is this repo's only
      # record of what CI actually covers, and it went one stale before anyone
      # noticed — then, checked properly on 2026-08-15, turned out to be four
      # wrong at once (it said ten, filed bar-rc-executable as darwin-only and
      # desktop-projection as portable, and had never heard of
      # bar-plugins-executable). A prose census of a machine-readable fact rots
      # in every direction, so re-derive both lists from that `optionalAttrs`
      # line rather than editing the sentence you're standing next to.
      #
      # The darwin-only twelve fingerprint a real evaluated system, so they stay
      # guarded and don't run here — they fire on a Mac, by hand, or not at all:
      # catalogue (every desktop, pack and compat alias raised as a real system),
      # fragment-compat (the retired top-level fragments' old spelling against
      # their new one), desktop-projection (the example host's carved values vs
      # the committed projection — the one thing that can notice the hacker
      # desktop quietly stopping short of what the module defaults used to give),
      # accent-reach, scale-reach, font-reach, standalone-modules, ai-room,
      # desktop-seam, editor-choice, bar-bottom-focus and bar-bottom-groups.
      - run: nix flake check
      # The annotated host template (hosts/<host>/options.nix) ships every
      # option's DEFAULT as a line you can uncomment. host-template.nix's own
      # build already proves the file parses both as-shipped and uncommented;
      # this proves the uncommented values are LEGAL for their options — a
      # `defaultText` that has drifted from the real default (wrong type, a
      # stale enum member) parses fine and only fails on the machine of whoever
      # uncomments that one line, months later. `…` placeholders are the
      # deliberately-not-pasteable ones and are excluded, exactly as the
      # derivation's own check does.
      - name: every default in the host template is settable
        run: |
          tmpl=$(nix build --no-link --print-out-paths .#host-template)
          host=$(mktemp -d)
          printf '{ ... }:\n\n{\n  imports = [ ./options.nix ];\n}\n' > "$host/default.nix"
          # The ` =` is load-bearing — see modules/host-template.nix, which runs
          # the same substitution: a description line that wraps to start with
          # `haus.` is not an assignment and uncommenting it breaks the parse.
          sed -E 's/^  # (haus\.[A-Za-z0-9._-]+ =)/  \1/' "$tmpl/share/haus/host-options.nix" \
            | grep -v '= …;$' > "$host/options.nix"
          # A prefix that no longer matches would uncomment NOTHING and this
          # step would pass on an empty host — the one failure it can't see.
          grep -q '^  haus\.' "$host/options.nix"
          nix eval --impure --apply 'x: x.system.drvPath' --expr \
            "(builtins.getFlake \"path:$PWD\").mkHaus { username = \"ada\"; hostname = \"lovelace\"; host = $host; }"

  shellcheck:
    name: shell scripts
    runs-on: ubuntu-latest
    # See the eval job above — this is the one that hung, repeatedly. The
    # ceiling is the backstop; the fix is that this job no longer speaks to apt
    # at all (see the shellcheck step).
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      # `bats` is the ONE tool this job needs that the runner image lacks, and
      # npm is preinstalled, so it comes from npm rather than apt. That is the
      # whole reason this job no longer stalls.
      #
      # It used to `apt-get update && apt-get install shellcheck bats`, and that
      # hung for hours at a time — twice within a day, most recently on #406.
      # Three separate things were wrong with it:
      #
      #   1. `shellcheck` is ALREADY on the ubuntu-latest image (0.9.0), so the
      #      lint never needed apt in the first place. Half the reason to talk
      #      to a package mirror was imaginary.
      #   2. The Azure mirrors the runner is pointed at (`Ign:` on every
      #      `azure.archive.ubuntu.com` line in the log) fail in a way apt does
      #      not treat as failure: it falls back to `archive.ubuntu.com` and
      #      keeps going, so the step can look alive while getting nowhere.
      #   3. `Acquire::http::Timeout` — the fix attempted in #390 — does NOT
      #      cover this. It bounds a single HTTP connect/read, not the step, and
      #      it says nothing at all about `https://` sources, which is what the
      #      mirrorlist actually resolves to. So the retries multiplied against
      #      an unbounded whole rather than capping it.
      #
      # The durable lesson is #1: prefer what the image already ships, and where
      # something is genuinely missing, get it from a package manager whose
      # registry isn't the runner's own distro mirror. If apt ever becomes
      # necessary again, wrap the WHOLE call in `timeout 120 …` — a per-request
      # option cannot bound a step that retries.
      - name: bats
        run: sudo npm install -g bats
      # bootstrap.sh is the standalone curl|bash installer — the one shell
      # script here that isn't a nix template (@PLACEHOLDER@ substitution) or a
      # zsh sketchybar plugin, so it's the one we can lint as-is. Warning level
      # catches real bugs (undefined vars, bad quoting) without failing on
      # info-level style nits. It's what hausfold.co/hacker.sh serves, so a
      # regression here reaches every new installer.
      - name: shellcheck
        run: |
          # shellcheck comes from the runner image — no install step. Print the
          # version so a future image change that drops it fails loudly here
          # rather than as a confusing "command not found" mid-lint.
          shellcheck --version
          # bootstrap.sh reaches every new installer via hausfold.co/hacker.sh;
          # haus.sh + awake.sh ship onto every machine as end-user CLIs.
          # statusline-refresh.sh is linted for a different reason: it runs
          # DETACHED with its output discarded, so a non-zero anywhere in it is
          # completely invisible — the bar just quietly stops updating.
          # test/haus-settings.sh can only be RUN on macOS — it evaluates a
          # darwinConfiguration — so this runner can never execute it. Linting is
          # the only thing CI can do for THAT one, and the alternative is a suite
          # that nothing at all touches until someone remembers it by hand.
          # test/haus-plan.sh is linted here and also RUN below: its subject is
          # pure parsing over fixture files, so it needs neither Nix nor a Mac.
          shellcheck --severity=warning bootstrap.sh modules/core/haus.sh modules/core/awake.sh modules/core/statusline-refresh.sh test/awake.sh test/haus-settings.sh test/haus-plan.sh
      - name: awake lifecycle tests
        run: bash test/awake.sh
      # `haus plan`'s parsers, and the only part of plan CI can execute: they
      # read a BUILT activation script and a home-manager generation, both of
      # which this suite hand-writes as fixtures, so no Nix and no Mac needed.
      # Worth running rather than only linting, because the failure mode they
      # guard against is a preview that says "nothing was changed" about a
      # rebuild that changes something — silence, which no lint can catch.
      - name: haus plan parser tests
        run: bash test/haus-plan.sh
      # The refresher is `holt`'s reader, and it fails in the one way nobody sees:
      # it runs detached under `set -e`, so any non-zero leaves the LAST panel.tsv
      # in place and the bar keeps showing worktrees that were reaped hours ago —
      # no error, no empty bar, just a confidently stale one. Same hermetic shape
      # as holt's own acceptance suite (throwaway repos, shim gh, redirected cache).
      - name: statusline refresher tests
        run: bats test/statusline-refresh.bats
      # The render path's counterpart suite. Its subject is the Fable/Mythos row
      # tint, whose correctness is a WIDTH invariant across rows that carry both
      # SGR and OSC 8 — so it breaks silently whenever a segment is added, and
      # the breakage reads as a terminal quirk rather than a bug. Same hermetic
      # shape again; needs only git + jq + bats.
      - name: statusline render tests
        run: bats test/statusline.bats
