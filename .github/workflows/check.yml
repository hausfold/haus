name: check

on:
  push:
    branches: [main]
  pull_request:
  # Let a branch be checked on demand (e.g. before opening a PR) without
  # having to push to main first.
  workflow_dispatch:

# A second push to a PR branch makes the first run's answer worthless, and the
# abandoned run still holds a runner — a runner the next PR then waits
# behind.
#
# Only a PR run is ever in a shared group. Everything else keys on the commit,
# so it gets a group of its own: putting main pushes in one group would
# SERIALIZE them even with cancelling off, and GitHub cancels a *pending* run
# when a newer one joins its group — so three merges inside one build would
# leave the middle commit with no run at all. That is the tick this is
# supposed to protect.
concurrency:
  group: check-${{ github.event_name == 'pull_request' && github.ref || github.sha }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  # ── The nix half, and which of its three jobs a new step joins ───────────
  #
  # It was one job of six steps run one after another, and it was the PR gate:
  # ~1m40s, against a shell half that has been four parallel jobs of 58s or
  # less since #716. Warm — a PR touching no .nix file, which is most of them
  # — that 1m40s is 35s of cache restore and 56s of work. Measured on run
  # 34686000184: nix eval 6s, nix flake check 1s, host template 7s, haus show
  # 6s, haus add 36s.
  #
  # ⚠️ Every `nix flake check` figure in this banner — the 1s here, the 57s
  # and 67s cold below — is from before the darwin checks joined that step.
  # It runs 193s now, 186s of it evaluation, and it is the gate's pole; the
  # account sits above the `nix flake check` line in the `checks` job. The
  # `nix eval` figures beside them are untouched: that job did not change.
  #
  # ⚠️ Do not quote the workshop's docs/ci.md `nix eval` 55s beside those.
  # That is the COLD figure — the same step with no store to come back to —
  # and it is not additive with the warm ones. Those runs sat at 92–132s warm
  # and 143–166s cold, and reading one for the other is how this half got
  # measured wrong once already.
  #
  # ⚠️ The `nix flake check` 37s that used to sit beside that 55s is gone, and
  # the split is what took it: 37s was measured with the check running AFTER
  # `nix eval` in the same job, so nixpkgs was already in the store and paid
  # for. `checks` is its own job with its own empty store now, and cold it is
  # 57s (run 34693030435). Any cold figure from before #721 carries the same
  # hazard — it was measured downstream of a step that is a different job now.
  #
  # Every re-measure starts by reading the "Restore the Nix store" step:
  # 30s-plus means warm, under a second means the key missed and everything
  # below it paid full price.
  #
  # The grouping is by what a step NEEDS, then by what a restore costs:
  #
  #   eval      the flake read straight, plus the two bash suites that read
  #             what it BUILDS — `nix eval`, the host template's defaults and
  #             `haus show`. Not one of the three is worth a restore of its
  #             own, so they are one job.
  #   checks    `nix flake check` alone, and the gate's pole since the darwin
  #             checks joined it: 193s on run 35591587897, of which 186s is
  #             EVALUATION and 6s is build. A warm restore does not touch the
  #             186s. COLD it is also the one step that BUILDS, which is what
  #             earned it a job of its own before that. It is the step this
  #             repo keeps adding to, and the only one whose store is nobody
  #             else's subset.
  #   acquire   the two suites that drive a REAL consumer flake through a real
  #             nix: `haus add`/`desktop`/`remove`, and `haus set`/`get`/
  #             `reset`/`unset`. Neither is a flake check — both scaffold a
  #             consumer on disk and run nix against it — and neither wants a
  #             store cache, which is what keeps them together and apart from
  #             the other two.
  #             It was `haus add` alone and the pole at 36s, 24 of which were
  #             `nixpkgs#nixfmt` resolving through the flake REGISTRY — that
  #             unpacks channels.nixos.org's nixexprs.tar.xz into ~/.cache/nix,
  #             which is not the /nix store, so cache-nix-action never held it
  #             and the fetch was paid warm and cold alike. test/haus-add.sh
  #             now takes nixfmt from this flake's OWN lock (`--inputs-from`),
  #             so the name resolves with no fetch at all and the step is 13s.
  #             test/haus-settings.sh joined it at 35s, taking the job 46s →
  #             84s (run 35595368851). It is 66s in a job of its OWN — `haus
  #             add` in front of it has already realized nixpkgs and read this
  #             flake, so the settings suite pays for neither. Quote the 35s
  #             for what this job costs and the 66s for what the suite costs;
  #             the step's own account is beside it below.
  #
  # ⚠️ "Nothing here is bigger than the restore in front of it, so the next
  # step joins a job rather than opening a fourth" used to close this list, and
  # the settings suite is the first step to break its premise — 66s alone,
  # twice the restore the other two jobs pay and one this job does not pay at
  # all. It joined anyway, and the measure that says so is
  # rule 5 of the family's CI rules rather than this one: the gate is the
  # longest job, `checks` is 180-243s, and a fourth job cannot take a second
  # off THAT. So the number a new step is measured against is the distance from
  # the job it would join to the POLE, not the restore standing in front of it.
  # On run 35594402514 that distance was 197s and the step spent 38 of it.
  #
  # ⚠️ And "66s alone" is why the fixed cost misleads in the first place: a
  # step measured on its own carries setup the job it joins has already paid.
  # In place it is 35s. A step is only as expensive as the job it lands in.
  #
  # Three jobs and not six, for the reason the shell half's banner further down
  # gives: the gate is the longest job, not the total, and every job pays
  # checkout, the Nix install and a cache RESTORE again. The restore is ~35s of
  # that and is the largest fixed cost in this half, which makes it the number
  # a new step is measured against. Under it, join an existing job.
  #
  # Measured on the split's own first run, 34688533513, warm off the entry
  # the single job had saved, which each lineage step still read then: eval
  # 57s, checks 56s, acquire 77s, and the whole `check` run 77s wall against
  # the 99–166s the single job had been costing. Taking the nixfmt fetch out
  # of the suite (34690798332) took its step from 38s to 13s, and what the
  # three jobs now do is eval 19s across its four steps, checks 2s, acquire
  # 13s.
  #
  # ⚠️ Job TOTALS stopped tracking that — 66s, 41s and 69s on the same run —
  # because everything left in them is the RESTORE, 33-47s of it, which varies
  # by more between two runs than any step in this half now costs. Read the
  # step, not the job, and split nothing further until a step can beat the
  # restore standing in front of it.
  #
  # Whether the nixfmt cut still holds is one grep of the acquire log, and the
  # string is **channels.nixos.org**, not `nixexprs.tar.xz`: the flake's own
  # locked nixpkgs is a nixexprs.tar.xz too (releases.nixos.org, flake.lock),
  # so a COLD run — which the lineage reset below guarantees at least weekly —
  # prints that shape legitimately while fetching the input the cut moved TO.
  #
  # ⚠️ Those restores do NOT get smaller at the next push to main, and the
  # first draft of this comment said they would. The store is saved WHOLE —
  # the `gc-max-store-size` note further down is the reason — so each job's
  # first tokened save carries forward the half-gigabyte union it had just
  # restored, whoever built it. Three jobs' entries only become three jobs'
  # SIZES at the next lineage reset, when the ISO week or the nixpkgs rev
  # moves, all three go cold, and each builds only what it asks for. Until
  # then expect three entries of roughly the old one's size, and read the job
  # token out of the key the restore step logs if you want to know whether the
  # split is keying correctly — the size tells you nothing about that. (The
  # reset came on 2026-09-13 and it played out exactly so; the measured table
  # is below, and `acquire` has since stopped keeping an entry.)
  #
  # ✅ Both halves of that held. Run 34689237922, the split's first push to
  # MAIN — 34688533513 above is its PR run, which restores but never saves —
  # restored the one untokened 577.0 MiB entry into all three jobs and saved
  # 606.6 / 586.7 / 607.0 off it, and every restore since has logged a key
  # under its OWN token. The sizes below are inheritance plus creep — no job
  # is reading another's entry.
  #
  # ── Whether to save a NARROWER store per job. Measured; the answer is no ──
  #
  # Run 34693030435 ran each of these three jobs' steps twice off this
  # branch's base: once from an EMPTY store, which is what the job actually
  # needs, and once restoring the live entry and then reading nothing, which is
  # what the entry carries. As nar bytes:
  #
  #              needs (cold)   carries (warm)   never opened
  #     eval       1100 MiB       1877 MiB          41%
  #     checks     1126 MiB       1826 MiB          38%
  #     acquire     685 MiB       1876 MiB          64%
  #
  # `acquire` is the clearest: 1229 MiB it never opens, against 685 MiB it
  # does. Two SEPARATE things put it there, and only the diff of the three
  # artifacts separates them — about 733 MiB is `eval`'s and `checks`' cold
  # stores, which the pre-split job built and all three entries inherited
  # through the transitional prefix #722 removed; the other ~496 MiB, 300
  # paths, is in no job's cold store at all. That is the within-lineage save
  # creep the block above describes — the same `-source` unpacked at a dozen
  # revs, plus 175 `.drv`s — because a restore unions and nothing collects.
  #
  # So the reset clears both, but only the first stays cleared — and both
  # halves of that are now measured rather than projected. #735's merge moved
  # the nixpkgs half of the lineage key for the first time, all three jobs
  # went cold, and each saved only what it built:
  #
  #                  projected    saved cold      before
  #     eval           ~320        330.2 MiB      1037 MiB
  #     checks         ~328        340.4 MiB       721 MiB
  #     acquire        ~199        202.3 MiB       909 MiB
  #
  # Within 4%, off a ~3.4:1 cold compression taken from run 34685699373, the
  # first save this repo ever made (1623.0 MiB of nar out as a 472.1 MiB
  # entry). So "a cold job saves only what it built" holds, the repo went from
  # 3.1 GB of entries to 1.5, and #724's ~373 / ~368 / ~233 was ~12% high.
  # ⚠️ These are FIRST-RUN-OF-A-LINEAGE numbers. The creep resumes
  # immediately and the next reset is what collects it, so the honest shape of
  # this half's cost is a sawtooth, not a floor.
  #
  # ── The slope, reconstructed over W37's whole lineage (2026-09-13) ──
  #
  # Every saving run logs the entry it uploaded, so the lineage rebuilds
  # exactly from the run history. Eleven saves, 2026-09-12T10:44 to
  # 2026-09-13T06:19 — the first of them the split's own, so ten intervals —
  # as compressed MiB:
  #
  #     eval     606.6 → 915   +30.8 a save
  #     checks   586.7 → 721   +13.4 a save
  #     acquire  607.0 → 909   +30.2 a save
  #                            ────────────
  #                            +74.4 a push that saves
  #
  # Linear to ±1 MiB, with no sign of saturation. ⚠️ The unit is the SAVE,
  # not the day: a push whose `flake.lock` and `*.nix` are untouched hits the
  # primary key and saves nothing. 793 of the last 1048 main pushes touched
  # one, 76%, and the five full weeks before this one ran 145 / 106 / 128 /
  # 126 / 116 saves.
  #
  # ⚠️ The ~24 MiB a save this banner and the workshop's docs/ci.md both
  # quoted was low. The same reconstruction over the single pre-split entry
  # (472.1 → 687.6 in six) reads 30-43 MiB a save, mean ~36, so the split did
  # not TRIPLE the slope — `checks` creeps at under half what the other two
  # do — it doubled it.
  #
  # ⚠️ Against GitHub's 10 GB, three entries at that slope did not fit in a
  # WEEK. 872.9 MiB cold (measured, above) plus 74.4 a save, plus the 45.7 MiB
  # `determinatesystem-nix-installer` entry that counts too, clears 10 GiB at
  # 125 saves — and the five full weeks before this one ran 145 / 106 / 128 /
  # 126 / 116: the median is 126, past the line, and three of the five are
  # well over it — a W32-shaped week ends near 11.4 GB. W37, the week this
  # slope was measured in, is the quiet outlier at 67 saves, which is why a
  # glance at the entries mid-week read as comfortable.
  #
  # TWO things answer it, and the prefix below carries both.
  #
  # `acquire` keeps no cache at all — the A/B further down is why, and it is
  # about seconds rather than bytes, but it takes 30.2 MiB a save and a cold
  # 202.3 MiB out of this arithmetic as a side effect. What is left is two
  # entries at 44.2 a save off 670.6 MiB cold, which clears 10 GiB at 215
  # saves against a median week's 126.
  #
  # The week is HALVED anyway — the prefix carries the ISO week plus a
  # first/second half off `date -u +%u`, resetting Monday and Thursday — which
  # puts a median lineage (63 saves) at ~3.4 GB and a W32-shaped one (73) at
  # ~3.9. Belt and braces on purpose: 215 saves of headroom against a 73-save
  # busy half is the margin this arrangement lacked, and the reset is the half
  # that keeps working if a job is added back. It costs one more cold run a
  # week plus the PRs opened in the gap ahead of it, and the purge stays a
  # sweep of `nix-<os>-<job>-`, so it still reaches across lineages.
  #
  # ⚠️ What the history does NOT support is the restore scaling with the
  # entry. Over 63 restores spanning 472-885 MiB — the whole life of this
  # cache, both pre-split lineages included, and a 1.9x range because the
  # lineage prefix landing on run 34687260007 reset one entry from 687.6 to
  # 471.9 — the download-and-extract phase is 32.4s flat. Pearson r = -0.075:
  # entries under 520 MiB averaged 33.5s against 32.3s for those over 800, so
  # if anything the small ones were slower. The step around it is 34-50s with
  # no trend either. Path COUNT and GitHub bound it, not bytes, which is why
  # nebelung's 332 MiB in 17s does not extrapolate onto a store made of
  # `.drv`s. So the ~20 / ~20 / ~10s this block used to project has nothing
  # behind it, and the reset's prize is the ~950 MiB of other jobs' work the
  # three entries shed, not seconds. ⚠️ 472 MiB is as low as the evidence
  # goes and the post-reset entries are projected below it, so W38's first run
  # is still the one to read: the workshop's
  # `script/probes/ci-cache-value.sh haus`.
  #
  # ⚠️ Which is exactly why not to narrow them by hand on top of that. The gate
  # is the longest job of the RUN, and measured over eight PR runs that is
  # `acquire` at 70s avg (min 54s), `eval` at 61s — and `shell suites, the
  # agent surface` at 57s, which becomes the pole the moment these three drop
  # under it. Everything the nix half's restore could still give back after the
  # reset is time the shell half is already spending, so a `gc-max-store-size`
  # (which has nothing to root — the input below says why) or a hand-rolled
  # root set buys the gate ZERO. Re-open this when the POLE shell job gets
  # under 40s, not when `lint` does.
  #
  # The ~35s restore the banner above measures a new step against is a W37
  # number; read the restore step of the run in front of you rather than
  # quoting it. ⚠️ But do not expect it to FALL with the entry — the
  # 63-restore fit above says it does not — so the bar is ~35-50s on the first
  # run of a half-week too, and every step in this half is under it. ⚠️ And
  # the bar only exists where a restore does: a step joining `acquire` is
  # measured against nothing, because that job pays no restore at all. That is
  # not an argument for a fourth job either — `acquire`'s own note says why
  # splitting it again only moves the seconds.
  #
  # ── The restore against the work, same hour, same runners (2026-09-13) ──
  #
  # #735 changes the lineage key, so its PR run built COLD — restore step 0-1s
  # — while #734's, a comment-only change on the same base minutes earlier,
  # restored the live entries. Two PR runs, so neither pays a save, which
  # makes them the one clean A/B this half has had:
  #
  #                 cold      warm (restore + work)      the cache
  #     eval        81s       71s  (44 + 20)              buys 10s
  #     checks      75s       42s  (34 +  2)              buys 33s
  #     acquire     45s       71s  (50 + 13)              COSTS 26s
  #
  # `acquire`'s cache was not marginal, it was 26s of pure loss — the 44s
  # cold against 54s warm this paragraph used to quote was two samples taken a
  # day apart, and the gap is wider than that made it look. ✅ So it is GONE;
  # the job's own steps carry the note. The gate, the longest job of the run,
  # was 81s cold against 71s warm with `eval` and `acquire` tied on it, and is
  # now `eval`'s 71s alone, one gigabyte-class upload a push lighter.
  #
  # ⚠️ A reset would not have rescued it, which is why this did not wait for
  # one. At the flat ~32s the fit above measures, even the 202.3 MiB `acquire`
  # actually saved cold puts it near 48s against 45s: the restore IS the cost
  # and it does not shrink with the entry.
  #
  # Two cold figures moved while nobody was looking. `nix flake check` is 67s
  # cold now against #724's 57s — it is the step this repo keeps adding to and
  # the one job whose cache plainly pays — and `nix eval` is 55s, unchanged.
  # The rule stands: if a job in this half carries a store it does not roughly
  # fill, check the cold number before assuming the cache pays.

  eval:
    name: eval the example host
    runs-on: ubuntu-latest
    permissions:
      contents: read
      # cache-nix-action purges its own superseded entries through the API.
      actions: write
    # A ceiling, not a target: this job runs in about a minute. It exists
    # because GitHub's default is SIX HOURS, and a step that hangs rather than
    # fails sits there burning the whole budget while the PR shows "running" —
    # which is exactly what happened on 2026-08-18, when the shellcheck job's
    # `apt-get update` stalled on the Azure Ubuntu mirrors and had to be
    # cancelled by hand after two hours. All three jobs in this half carry it.
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      # Bare, and measured: `max-jobs` stays at upstream's 1. The account is
      # above `checks`'s copy of this step, and this job has even less for the
      # knob to reach — five derivations cold, the longest of them 5.2s
      # (`haus-host-template`), and `haus-options-json` waiting on
      # `options.json` in front of it. The 49s in this step is EVALUATION,
      # which no job count touches.
      - uses: nixbuild/nix-quick-install-action@v35
      # Which store the restore below is allowed to come back to. A restore
      # UNIONS and nothing collects it, so one lineage grows forever: the
      # three entries together put on 74.4 MiB per push that SAVES — measured
      # over W37's whole lineage, banner above — on a key three pushes in four
      # move, and at this repo's rate 10 GB is ONE WEEK away, not years —
      # which is the banner's finding above, and why a week is no longer
      # short enough. Arriving there is not a warning: a save that no longer
      # fits just means every run pays full price again, which is the
      # surprise the cache exists to prevent.
      #
      # ⚠️ `.nodes.nixpkgs` is NOT this flake's nixpkgs, and reading it there is
      # how the second half of this key stayed dead from the day it landed.
      # `root.inputs` names ours `nixpkgs_2`; the node spelled `nixpkgs` is
      # CATPPUCCIN's pinned tarball, which had not moved in six months. Every
      # key from the lineage landing until this commit carried `89570f24e97e`
      # while the real input went 2026-07-28, 08-13 and 09-03 and reset
      # nothing — so the second stdenv the next paragraph exists to prevent was
      # being unioned in, and is part of the per-save creep the banner above
      # measures. Go through `root.inputs`, and never name a lock node
      # directly: the `_2` suffixes are assigned by lock ORDER, so the bare
      # name belongs to whichever input reached it first and moves under you.
      #
      # So the prefix carries an ISO week and the nixpkgs rev, and the lineage
      # restarts on either. The first main push of a week (or of a nixpkgs
      # bump, which would otherwise union a second stdenv onto the first)
      # builds cold and saves a fresh entry, and that save is also what deletes
      # the lineage it replaces. One cold run a week is the whole cost of it,
      # and PRs opened in the gap before that push pay full price too. ⚠️ A
      # week is measured to be too long for three entries — the banner above
      # has the slope and the half-week token that answers it.
      #
      # ⚠️⚠️ THE NIXPKGS HALF OF THAT HAS NEVER FIRED, and the `jq` path below
      # is why. `.nodes.nixpkgs` is not this flake's nixpkgs — `root.inputs`
      # names it `nixpkgs_2` — it is CATPPUCCIN's pinned tarball, which has not
      # moved in six months, so every key since the lineage landed carries
      # `89570f24e97e` while the real input went 07-28, 08-13 and 09-03 and
      # reset nothing. The second stdenv this paragraph exists to prevent is
      # therefore part of the creep the banner measures. The fix is one line,
      # `.nodes[.nodes.root.inputs.nixpkgs].locked.rev`, in all three jobs, and
      # it is deliberately NOT in this change: it forces a cold run the moment
      # it lands, and the banner's "126 saves in one lineage" holds only
      # because this half is dead. Fixing it adds a reset every 2-3 weeks —
      # nowhere near enough to bound a 145-save week, so the verdict above
      # survives it. A
      # `gc-max-store-size` cap instead of any of this would take exactly the
      # paths the next run wants — see the comment on that input below.
      #
      # The `eval-` token in front of the week is this half's other rule; the
      # block above the restore step has it. The other two jobs carry this
      # same step with their own token and no second copy of this account.
      #
      # Watch the slope with workshop's `script/probes/ci-cache-value.sh haus`.
      - name: Which store lineage this run belongs to
        id: lineage
        run: |
          rev="$(jq -r '.nodes[.nodes.root.inputs.nixpkgs].locked.rev // "norev"' flake.lock)"
          # `a` Mon-Wed, `b` Thu-Sun. An `if` rather than `[ ] && half=b`:
          # the default shell here is `bash -e`, so a false test as a line's
          # last command would fail the step.
          if [ "$(date -u +%u)" -ge 4 ]; then half=b; else half=a; fi
          week="$(date -u +%G-W%V)$half"
          echo "prefix=nix-${{ runner.os }}-eval-$week-${rev:0:12}-" >> "$GITHUB_OUTPUT"
      # The eval pulls nixpkgs; without a store to come back to, every run paid
      # for that from scratch. Within a lineage the key is the flake inputs and
      # the nix sources, so a lock bump or a module edit pays full price and
      # everything else — a docs change, a shell script, a bats fixture —
      # restores.
      #
      # ⚠️ ONE ENTRY PER JOB, AND THE JOB'S NAME IS IN THE KEY. This half's
      # three jobs on the single primary key they used to share would have
      # raced on main in two ways at once, both silent:
      #
      #   the SAVE — whichever job reached its post phase first would write the
      #   entry and the other two would be refused it as already present.
      #   `checks` is the one whose store is nobody's subset: a whole check
      #   set's worth of derivations `eval` never asks for. A shared key means
      #   the first writer decides what the other two come back to, and
      #   whichever of them needed more rebuilds it on every run — which reads
      #   not as a race but as a cache that quietly stopped paying.
      #
      #   the PURGE — `purge-prefixes` below used to be the broad `nix-<os>-`
      #   with `purge-created: 0`, which takes every entry under that prefix
      #   created before this job's post phase. `purge-primary-key: never`
      #   protects only the job's OWN key, so three jobs sweeping that prefix
      #   together on main would each delete the other two's fresh entries.
      #
      # ⚠️ Neither of those is "the three stores are disjoint", and an earlier
      # draft of this comment said it was. They overlap heavily and `acquire`'s
      # is close to a SUBSET: `#show` and `#desktop-check` are `eval`'s too
      # (test/haus-show.sh builds both), the scaffolded consumer pins
      # `path:$root` so its lock is haus's own inputs, and since the nixfmt cut
      # even nixfmt is shared — `.#host-template` realizes it in `eval`. ⚠️
      # `acquire` keeps no entry at all now, for reasons of SECONDS rather
      # than overlap — its own steps carry that — so what is left is two.
      # Separate entries are for the write refusal and the purge sweep above,
      # not for
      # unshared content, and collapsing them back to one loses both.
      #
      # So the job token sits between the OS and the week, and each job purges
      # `nix-<os>-<job>-` alone. The weekly reset still works — a new week
      # lands a new key under the same job prefix and the old one is swept —
      # and no job can reach another's. Three entries per lineage rather than
      # one: the three overlap heavily (all of them carry nixpkgs), and the
      # weekly reset bounds the total the same WAY it always did — but the
      # total is three entries now, so the slope it bounds is steeper. ⚠️ That
      # look the first week after this has been taken, and the answer is in the
      # banner above: steeper by 2x, and steep enough that a WEEK no longer
      # bounds it. The ~0.5 GiB the combined entry cost is not the scale any
      # more either — the three ran 2.5 GiB by day two. `gh cache list --repo
      # hausfold/haus` is still the number that counts.
      #
      # The pre-split entry carries no token, so nothing here purges it — and
      # with the transitional prefix that warmed the split off it now gone,
      # nothing reads it either. GitHub
      # evicts a cache nothing has read in seven days, which is what finally
      # collects it.
      #
      # A new job in this half copies this step, changes the one token, and is
      # a new entry. ⚠️ Its token may not be a PREFIX of an existing one: the
      # purge is a prefix sweep, so a job called `eval-fast` would have every
      # entry it saves deleted by `eval`'s `nix-<os>-eval-`, silently and on
      # every push to main. Pick a token no other job's is the start of.
      # Duplicated rather than shared, because two jobs share no environment —
      # the same call `draw` and `eval` make for snug's fetch.
      - name: Restore the Nix store
        uses: nix-community/cache-nix-action@v7
        with:
          primary-key: ${{ steps.lineage.outputs.prefix }}${{ hashFiles('flake.lock', '**/*.nix') }}
          restore-prefixes-first-match: |
            ${{ steps.lineage.outputs.prefix }}
          # Only a push to main writes a cache, and this line is what makes
          # that true — GitHub's ref scoping governs READS, not writes. Left on
          # the default, every PR would upload its own multi-gigabyte copy
          # scoped to `refs/pull/N/merge`; this repo is MADE of .nix files, so
          # nearly every PR misses the key, and two open ones would push us past
          # GitHub's 10 GB budget. Its LRU eviction would then take the main
          # entry this whole thing exists for. It reads the REF rather than the
          # event because of `workflow_dispatch`: dispatched from a feature
          # branch, an event test would save a multi-gigabyte entry scoped to
          # that branch, which no run on main can purge and only that branch
          # can restore.
          save: ${{ github.ref == 'refs/heads/main' }}
          # One store entry per ref per JOB, not one per key we have ever had.
          # The sweep runs AFTER the save, not before: it takes every
          # `nix-<os>-eval-` entry created before this job's post phase, which
          # the one just written is not. `purge-primary-key: never` is what
          # keeps the pass that DOES run first off the entry being reused when
          # the key already hits. Both are scoped to the run's own ref, so a PR
          # can only ever reach its own — and now to this job's own prefix, so
          # it cannot reach `checks` either (`acquire` no longer has one).
          purge: true
          purge-prefixes: nix-${{ runner.os }}-eval-
          purge-created: 0
          purge-primary-key: never
          # No `gc-max-store-size-*`: every `nix build` this half reaches is
          # `--no-link`, so nothing here becomes a gcroot, and a collector run
          # before the save would empty almost everything it had just fetched
          # and built. The store is saved whole and carries forward, which the
          # ceiling can afford — the action logs `Current store size in bytes`
          # on the runs that save, and `gh cache list --repo hausfold/haus`
          # reports the compressed entry the 10 GB actually counts.
      - run: nix eval .#darwinConfigurations.example.system.drvPath

      # The annotated host template (hosts/<host>/options.nix) ships every
      # option's DEFAULT as a line you can uncomment. host-template.nix's own
      # build already proves the file parses both as-shipped and uncommented;
      # this proves the uncommented values are LEGAL for their options — a
      # `defaultText` that has drifted from the real default (wrong type, a
      # stale enum member) parses fine and only fails on the machine of whoever
      # uncomments that one line, months later. `…` placeholders are the
      # deliberately-not-pasteable ones and are excluded, exactly as the
      # derivation's own check does.
      - name: every default in the host template is settable
        run: |
          tmpl=$(nix build --no-link --print-out-paths .#host-template)
          host=$(mktemp -d)
          printf '{ ... }:\n\n{\n  imports = [ ./options.nix ];\n}\n' > "$host/default.nix"
          # The ` =` is load-bearing — see modules/host-template.nix, which runs
          # the same substitution: a description line that wraps to start with
          # `haus.` is not an assignment and uncommenting it breaks the parse.
          sed -E 's/^  # (haus\.[A-Za-z0-9._-]+ =)/  \1/' "$tmpl/share/haus/host-options.nix" \
            | grep -v '= …;$' > "$host/options.nix"
          # A prefix that no longer matches would uncomment NOTHING and this
          # step would pass on an empty host — the one failure it can't see.
          grep -q '^  haus\.' "$host/options.nix"
          nix eval --impure --apply 'x: x.system.drvPath' --expr \
            "(builtins.getFlake \"path:$PWD\").mkHaus { username = \"ada\"; hostname = \"lovelace\"; host = $host; }"

      # `haus show`'s exit codes, flags and JSON envelope, against the built
      # `#show` wrapper — the same thing `nix run github:hausfold/haus#show`
      # hands a publisher. It lives in this half rather than beside the other
      # shell suites because it needs a real `nix eval`, which is exactly what a
      # Nix BUILD may not do: the `desktop-show` check in `checks` covers
      # everything about this command that can be answered inside a derivation,
      # and this covers the part a publisher's CI actually depends on, which is
      # the number the process exits with.
      # `haus show`'s report draws through snug's bash painter now — five
      # budgeted tables — and a runner has no `snug` on PATH and no
      # /run/current-system, so without this the suite exercises only the
      # no-painter fallback and the tables ship untested. Same fetch as the
      # `draw` job's "snug's painter, at the pinned rev" and `acquire`'s,
      # duplicated rather than shared because no two jobs share an environment.
      - name: snug's painter, at the pinned rev
        run: |
          rev="$(jq -r '.nodes.snug.locked.rev' flake.lock)"
          [ -n "$rev" ] && [ "$rev" != null ] || { echo "no snug rev in flake.lock"; exit 1; }
          mkdir -p "$RUNNER_TEMP/snug"
          curl -fsSL --retry 3 --retry-all-errors --retry-delay 2 \
            "https://raw.githubusercontent.com/hausfold/snug/$rev/share/ui.sh" \
            -o "$RUNNER_TEMP/snug/ui.sh"
          echo "HAUS_UI_SH=$RUNNER_TEMP/snug/ui.sh" >> "$GITHUB_ENV"

      - name: haus show tests
        run: bash test/haus-show.sh

  checks:
    name: the flake's checks
    runs-on: ubuntu-latest
    permissions:
      contents: read
      # cache-nix-action purges its own superseded entries through the API.
      actions: write
    # The ceiling the other two carry, for the account above `eval`.
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      # ⚠️ BARE ON PURPOSE, AND THAT IS A MEASUREMENT. Upstream nix defaults
      # `max-jobs` to 1 where Determinate's nix.conf writes `auto`, so this job
      # realises its derivations ONE AT A TIME. `with: { nix_conf: max-jobs =
      # auto }` is one line away, and it buys this gate nothing — for two
      # reasons that hold independently of each other:
      #
      #   1. THIS JOB IS THE POLE NOW, AND NOT FOR A REASON max-jobs REACHES.
      #      It used to average 47s against `eval`'s 72s, and this note used to
      #      read "shaving a job that is not the critical path moves the gate
      #      by zero". Both stopped being true when the darwin checks joined
      #      this step: 221s against `eval`'s 62s on run 35591587897. What they
      #      added is EVALUATION — 186s of that step's 193s, before a single
      #      derivation is realised, single-threaded by construction. A knob
      #      governing how many builders run at once governs none of it.
      #      Re-measure this job against `eval` with
      #      `script/probes/ci-cache-value.sh haus` (in the workshop) — but do
      #      not reach for max-jobs to answer what it says.
      #   2. THERE IS ALMOST NOTHING TO PARALLELISE. Cold, this step builds
      #      ninety-one derivations, and ONE of them is the build phase: the
      #      generated wallpaper PNG (resvg + ImageMagick,
      #      modules/wallpaper/package.nix) and the `wallpaper` check that
      #      reads it are a SERIAL chain of 23.1-27.9s out of a 26.3-33.5s
      #      build phase. The other eighty-nine cost 3.2-5.7s together.
      #      max-jobs cannot split one derivation, so that chain is the floor
      #      whatever the knob says, and 3-6s is the ceiling on the whole
      #      change — the same order as the runner noise that would have to
      #      separate it.
      #
      # Measured off three cold runs on main — 34743613963 and 34744344070
      # (2026-09-13), 34948292425 (2026-09-15) — by reading the timestamp on
      # every `building '…drv'` line in the job log. That is also where the
      # max-jobs=1 default is visible without asking nix: the 25s wallpaper
      # build starts, and for 25s NOTHING else starts beside it.
      #
      # And cold is the rare shape. Across those same twenty-five pushes the
      # `nix flake check` step ran 1-4s on twenty-two of them — the restore
      # below handed back every check output, nothing was built at all, and
      # max-jobs had nothing to govern. 3-6s on one run in eight, on a job 25s
      # off the pole, is not worth the line.
      #
      # ⚠️ Every figure in this block predates the darwin checks joining this
      # step, and BOTH rows moved. The build row grew by about seventy
      # derivations — twenty-four checks plus their `expected`/`actual`
      # goldens, every one of them a local `writeText` or `runCommand` that
      # nothing substitutes — so "ninety-one" above is nearer a hundred and
      # sixty, and "the other eighty-nine cost 3.2-5.7s together" has that many
      # more cheap ones in it.
      #
      # The conclusion holds by a wider margin than when it was written, and
      # the newer measurement is what widens it: on run 35591587897 the whole
      # BUILD phase was 6s of a 193s step, eighty derivations, behind 186s of
      # evaluation. Seventy more trivial text derivations do not turn a serial
      # 25s wallpaper chain into something max-jobs can split, and nothing that
      # governs how many builders run at once reaches an eval.
      #
      # Re-take the build row the same way — the timestamps on the
      # `building '…drv'` lines, never the step total, which is now mostly
      # evaluation.
      #
      # What would change this: a second derivation as expensive as the
      # wallpaper, which could then run beside it.
      - uses: nixbuild/nix-quick-install-action@v35
      # The lineage prefix, with this job's own token — the account is above
      # `eval`'s copy of this step, and so is the reason the token is there.
      - name: Which store lineage this run belongs to
        id: lineage
        run: |
          rev="$(jq -r '.nodes[.nodes.root.inputs.nixpkgs].locked.rev // "norev"' flake.lock)"
          # `a` Mon-Wed, `b` Thu-Sun. An `if` rather than `[ ] && half=b`:
          # the default shell here is `bash -e`, so a false test as a line's
          # last command would fail the step.
          if [ "$(date -u +%u)" -ge 4 ]; then half=b; else half=a; fi
          week="$(date -u +%G-W%V)$half"
          echo "prefix=nix-${{ runner.os }}-checks-$week-${rev:0:12}-" >> "$GITHUB_OUTPUT"
      # This job's store is the big one and the one nobody else's is a superset
      # of: on a cold runner `nix flake check` BUILDS every check the flake
      # declares plus the intermediates they read. Every input here is `eval`'s
      # with a different token — read that copy for what each does.
      #
      # ⚠️ The restore is worth less to this job than it was, and that is worth
      # knowing before reading a warm run as cheap: what the darwin checks
      # added is evaluation, and no store entry has ever cached that. A hit
      # still saves the build. It saves none of the eval below it.
      - name: Restore the Nix store
        uses: nix-community/cache-nix-action@v7
        with:
          primary-key: ${{ steps.lineage.outputs.prefix }}${{ hashFiles('flake.lock', '**/*.nix') }}
          restore-prefixes-first-match: |
            ${{ steps.lineage.outputs.prefix }}
          save: ${{ github.ref == 'refs/heads/main' }}
          purge: true
          purge-prefixes: nix-${{ runner.os }}-checks-
          purge-created: 0
          purge-primary-key: never
      # ── What this one command now covers ────────────────────────────────
      #
      # ALL of it but one line. `nix flake check` on this runner runs every
      # check flake.nix declares except `brew-bundle-guarded`, and that is the
      # whole of the split — there is no second list to keep.
      #
      # It was not always: twenty-five checks sat behind
      # `optionalAttrs (hasSuffix "-darwin" system)` and fired on a Mac, by
      # hand, or not at all. Among them the three *-reach tables, which
      # enumerate every generated home file so that ANY new one is a missing
      # row — main merged red on exactly those at least twice. Twenty-four
      # moved up. (One of the twenty-four, `app-store-activation`, had been
      # running here until it was gated days earlier for reddening this job:
      # a true report of a real failure, with the wrong cause named.) What
      # moved them is not a Mac runner: it is
      # that raising a darwin machine and BUILDING one are different acts.
      # `eval` above instantiates a whole darwin system on this same
      # `ubuntu-latest` and always has. So flake.nix now names the two
      # platforms separately — `hostSystem` is the aarch64-darwin machine each
      # check reads, `system` is whatever box builds the comparison — and every
      # check that only READS an evaluated config is declared for Linux.
      #
      # ⚠️ `brew-bundle-guarded` is the exemption and the only kind there is:
      # it `builtins.readFile`s the BUILT `activate` script out of
      # `darwinConfigurations.example.system`, an import-from-derivation that
      # wants a darwin BUILDER. What it guards is the assembly order of a file
      # nothing produces until it is built, so there is no eval-time reading of
      # it that checks the same fact. It runs on a Mac or nowhere.
      #
      # So a new check does not need a reason to run here. It needs one to be
      # exempt, and IFD is the only one that has ever held.
      #
      # ⚠️ The hand census that used to stand in this spot is gone, and its
      # going is most of the point. It named every Linux check in a bullet
      # list, it was this repo's only record of what CI covered, and its own
      # comment recorded finding it wrong at least seven separate times — in
      # both directions at once on one reading, twice while its sentence
      # agreed with its own list, and twice in the week this was written.
      # Every one of those was found by running the eval and diffing, never by
      # reading. The diff is now one line long and nothing has to be written
      # down to keep it true:
      #
      #   nix eval --json .#checks.x86_64-linux   --apply builtins.attrNames
      #   nix eval --json .#checks.aarch64-darwin --apply builtins.attrNames
      #
      # The second minus the first is `["brew-bundle-guarded"]`. If it is ever
      # longer, either something grew an IFD or a check was gated by habit —
      # and the account above `checks` in flake.nix is where to argue it out.
      # What each check is FOR stays beside that check in flake.nix, which is
      # the one copy that cannot drift from it.
      #
      # ⚠️ AND THAT SENTENCE IS A FIXTURE. `checks-platform-split` in flake.nix
      # takes the two attribute sets those commands print, subtracts them, and
      # diffs the answer against the Nix list written above — every push, on
      # this runner, as part of the `nix flake check` below. So the record here
      # is held to the eval by the suite, which is the thing the bullet list
      # never had. Reword the prose around it as freely as any other comment in
      # this file; keep the clause "The second minus the first is" and the
      # backticked list after it, once, or the check fails saying it has
      # nothing left to read.
      #
      # That same exemption is named three more times in words — twice in the
      # paragraphs above, once in the `acquire` job — and nothing checks those.
      # A change here is a change to all four.
      #
      # ⚠️ This step is the pole of the whole gate now, and the cost is
      # EVALUATION. Measured on run 35591587897 (the PR that moved the checks
      # here), by the timestamps in this step's own log:
      #
      #   193s total  =  186s before the first `building '…drv'` line
      #                +   6s building eighty derivations
      #
      # against 1-4s warm and 67s cold for the same step the day before. The
      # job came to 221s behind a 22s restore, where `eval` took 62s — so the
      # nix half's pole moved here, and the gate went from about 75s to about
      # 3m40s.
      #
      # The 186s is the part no cache reaches. A store entry holds outputs, and
      # those eighty derivations are what it handed back most of; it has never
      # held an evaluation, and this step raises dozens of nix-darwin systems
      # before it realises anything. A warm run pays the 186s in full.
      #
      # Re-take it the same way and from a run, not from a local `nix flake
      # check` — that one starts from an eval cache no runner has.
      - run: nix flake check

  acquire:
    name: acquisition and settings, against a real lock
    runs-on: ubuntu-latest
    permissions:
      contents: read
      # No `actions: write`. That was for cache-nix-action's purge, and this
      # job keeps no cache — the block below says why.
    # The ceiling the other two carry, for the account above `eval`.
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      # Bare like the other two, and for the same reading — the account is
      # above `checks`'s copy. This job builds TWO derivations cold
      # (`haus-desktop-check`, `haus-show`), both sub-second: there is nothing
      # here a second build slot could have run beside anything.
      - uses: nixbuild/nix-quick-install-action@v35
      # ⚠️ NO STORE CACHE HERE, AND THAT IS A MEASUREMENT, NOT AN OVERSIGHT.
      # This job is 45s cold and was 71s warm — 50s of restore in front of a
      # 13s step — so the cache cost the run 26s every time it worked. The
      # cold/warm A/B is in the banner above `eval`, and so is the reason a
      # lineage reset does not fix it: the restore is ~32s whatever the entry
      # weighs, and this job's whole cold store is 202.3 MiB, nearly all of
      # which `eval` realizes anyway. 233 MiB from cache.nixos.org is simply
      # cheaper than 200-900 MiB from GitHub.
      #
      # So do NOT re-add one because the other two have it. The test is the
      # cold number against the warm one, PER JOB, and for `checks` it comes
      # out the other way by 33s. What would change this: a step here that
      # BUILDS rather than fetches, or a fetch that grows past the flat ~32s
      # a restore costs.
      #
      # The `nix-Linux-acquire-` entries this job used to write are now
      # unreachable — nothing saves them and nothing purges them — so GitHub's
      # seven-day no-read eviction collects the last one, exactly as it did
      # the untokened pre-split entry.
      # `haus add` renders through snug's painter the same way `haus show`
      # does, so it gets the same file at the same pinned rev. Nothing in the
      # suite SKIPS without it — the assertions are on words, not on colour —
      # but it is what the suite has always run with, and a curl of one file is
      # the cheapest step in this half. The account is above `eval`'s copy.
      # test/haus-settings.sh below runs with the same file set, and skips
      # nothing without it either — it never names `HAUS_UI_SH` itself; the
      # subject it spawns is what reads the variable out of the environment.
      - name: snug's painter, at the pinned rev
        run: |
          rev="$(jq -r '.nodes.snug.locked.rev' flake.lock)"
          [ -n "$rev" ] && [ "$rev" != null ] || { echo "no snug rev in flake.lock"; exit 1; }
          mkdir -p "$RUNNER_TEMP/snug"
          curl -fsSL --retry 3 --retry-all-errors --retry-delay 2 \
            "https://raw.githubusercontent.com/hausfold/snug/$rev/share/ui.sh" \
            -o "$RUNNER_TEMP/snug/ui.sh"
          echo "HAUS_UI_SH=$RUNNER_TEMP/snug/ui.sh" >> "$GITHUB_ENV"

      # Acquisition step D: `haus add`/`desktop`/`remove` edit a real
      # scaffolded consumer flake.nix and run a real `nix flake lock`, which is
      # exactly why this needs a real nix rather than a flake check — and, at
      # 36s, why it got a job rather than a step beside `haus show tests`. Two
      # thirds of that was the registry fetch the suite no longer makes, and at
      # 13s it no longer clears this half's bar for a job of its own. It keeps
      # one anyway: folding it back into `eval` would only move the seconds,
      # and the two would then share one cache entry, which is the arrangement
      # the banner above `eval` describes going wrong.
      - name: haus add/desktop/remove tests
        run: bash test/haus-add.sh

      # `haus set`/`get`/`reset`/`unset` end to end — 131 calls against a
      # scaffolded consumer, asserting the overlay file on disk and the value
      # read back. Most of them evaluate a real darwinConfiguration; the rest
      # are refusals that die in the path grammar before nix is reached, and
      # those are the cases with a history. test/settings-key.bats is the
      # pure-bash half (the path
      # grammar and the attrpath it generates); this is the half that can only
      # be had from nix, which is why it sits here and not in `rooms`.
      #
      # ⚠️ IT WAS LINTED AND NEVER RUN, ITS WHOLE LIFE, ON A REASON THAT WAS
      # NEVER TRUE — from #252 on 2026-08-07 to here, six weeks in which it
      # asserted nothing on any machine but a Mac somebody remembered to run it
      # on. Three places recorded it as "it evaluates a darwinConfiguration,
      # so this runner can never execute it" — which is the one thing this
      # image has always been good at: `eval` has read a whole darwin system
      # here since it existed, and since #762 every flake check but
      # `brew-bundle-guarded` does too. #762 removed the claim and left the
      # blocker recorded as UNESTABLISHED, because disproving a reason is not
      # the same as trying the thing. Nobody had taken the lint off and looked.
      # Somebody did: it passes on ubuntu-latest, cold store, first try, no
      # change to the suite (run 35594772634).
      #
      # 35s HERE, and 66s cold / 51s warm in a job of its own — the difference
      # is nixpkgs and this flake, which `haus add` above has already paid for.
      # 63s of that isolated 66 is CPU (39.6 user + 23.3 sys), so there is no
      # idle in it — the `bats --jobs` trick that halved scruff's gate would
      # find nothing here to overlap, which is worth knowing before anyone
      # tries. It joins this job rather than opening a fourth because a fourth
      # cannot shorten `checks`; the banner at the top of this file has that
      # arithmetic, and the measurement that a step costs less in company than
      # alone.
      #
      # It needs nix, a bash 4+ (it re-execs to find one; the runner's is 5.2),
      # jq and git — all of which this job already had — and no Mac at any
      # point. The macOS-only half of haus.sh is `capture`/`doctor`, which
      # reach `defaults`, `plutil` and `/run/current-system`; the set/get path
      # reaches none of them.
      - name: haus set/get/reset/unset tests
        run: bash test/haus-settings.sh

  # ── The shell half, and which of its four jobs a new suite joins ─────────
  #
  # It was one job of fifty steps run one after another: 2m28s, which made it
  # the family's slowest gate — the nix half beside it was ~1m40s in one job,
  # and a PR waits for the slowest job of all of them. Split four ways the
  # longest of these is under a minute (measured over ten PR runs: lint 23s,
  # rooms 53s, draw 53s, agents 58s), so the shell half is not the pole and has
  # room to grow before it is one again. The run went 2m30s → 1m43s; the nix
  # half's own split, the banner at the top of this file, took it down from
  # there.
  #
  # The grouping is by what a suite NEEDS, never by count. Fifty jobs would be
  # SLOWER, not faster: the gate is the longest job rather than the total, and
  # every job pays checkout and `npm install -g bats` again (~4s), which is
  # more than most of these suites take to run.
  #
  #   lint     the runner image alone. It is the one job that needs no bats,
  #            which is the whole reason it is a job of its own.
  #   draw     bats + snug's `share/ui.sh` at the rev flake.lock pins. The
  #            fetch is this job's FIRST step and every suite in it reads what
  #            that step writes.
  #   agents   bats + the image: the AI room's own scripts, plus the two
  #            surfaces an agent reads THROUGH it — `haus skill`/`haus get
  #            --json`, and the GitHub bridge the statusline gates on.
  #   rooms    bats + the image: every other room's scripts, hermetic over
  #            stubs and fixtures.
  #
  # ⚠️ A suite that SKIPS without the painter belongs in `draw` and nowhere
  # else. That rule used to be three "MUST stay below" comments asking a
  # reader to keep one step above others inside one long job; it is a job
  # boundary now, which is the only form of it that appending a step in the
  # wrong place cannot break. It still has to be got right when a suite is
  # ADDED, and it still fails the same way if it isn't: a skipped case reads
  # as a pass. Everything else goes with its room — and where that is a
  # toss-up, whichever of `agents` and `rooms` is the shorter that week.
  #
  # `bats` is the ONE tool these jobs need that the runner image lacks, and
  # npm is preinstalled, so it comes from npm rather than apt. That is the
  # whole reason none of them stalls.
  #
  # It used to `apt-get update && apt-get install shellcheck bats`, and that
  # hung for hours at a time — twice within a day, most recently on #406.
  # Three separate things were wrong with it:
  #
  #   1. `shellcheck` is ALREADY on the ubuntu-latest image (0.9.0), so the
  #      lint never needed apt in the first place. Half the reason to talk
  #      to a package mirror was imaginary.
  #   2. The Azure mirrors the runner is pointed at (`Ign:` on every
  #      `azure.archive.ubuntu.com` line in the log) fail in a way apt does
  #      not treat as failure: it falls back to `archive.ubuntu.com` and
  #      keeps going, so the step can look alive while getting nowhere.
  #   3. `Acquire::http::Timeout` — the fix attempted in #390 — does NOT
  #      cover this. It bounds a single HTTP connect/read, not the step, and
  #      it says nothing at all about `https://` sources, which is what the
  #      mirrorlist actually resolves to. So the retries multiplied against
  #      an unbounded whole rather than capping it.
  #
  # The durable lesson is #1: prefer what the image already ships, and where
  # something is genuinely missing, get it from a package manager whose
  # registry isn't the runner's own distro mirror. If apt ever becomes
  # necessary again, wrap the WHOLE call in `timeout 120 …` — a per-request
  # option cannot bound a step that retries. This is the account behind rule 1
  # of the family's CI rules, the workshop's docs/ci.md.
  #
  # `timeout-minutes` on all four is the same backstop the eval job carries,
  # for the same reason: GitHub's default is SIX HOURS, and the afternoon above
  # is what a step that hangs rather than fails costs. Nothing here speaks to
  # apt any more, so it is a ceiling none of them is expected to approach.
  #
  # ── Whether any suite earns a FIFTH job. Measured; the answer is no ──────
  #
  # `agents` is this half's pole, and on the first run of a lineage — when the
  # nix half drops to the ~39 / ~26 / ~29s the "Whether to save a NARROWER
  # store per job" block at the top of this file projects — it is the whole
  # gate's. ⚠️ Only on that run: that block's own warning is that those are
  # FIRST-RUN-OF-THE-WEEK numbers and the half's shape is a sawtooth, so by
  # mid-week `eval` and `acquire` climb back over 58s and `agents` is not the
  # gate at all. It only weakens the case below, so the question got asked at
  # its most favourable. Ten PR runs, job totals from the jobs API, everything
  # below job level off each job's own timestamped log (run 34741464030):
  #
  #              mean  min  max   suites   what is under it
  #     agents    58s   53   63     8      238 tests, ~50s of suite steps
  #     rooms     53s   44   59    30      ~44s, no suite over 9s
  #     draw      53s   50   58     6      ~45s, 22s of it IDLE — since fixed
  #     lint      23s   18   27     —      one shellcheck
  #
  # `agents` has no separable chunk, and that is the finding. The largest
  # SUITE in it is statusline-refresh at 14.5s of a ~50s job; the other seven
  # are 12.6s and down. Three clear ten seconds — statusline-refresh 14.5s (72
  # tests), vm-runtime 12.6s (11, and its clock IS the assertion: the stub
  # guests hold fds on purpose), github-signal 11.2s (31) — and nothing else
  # is over 4.2s.
  #
  # ⚠️ "No separable chunk" is a claim about the SUITES and not about the
  # tests, which are not flat: of 238 tests (median 0.087s, mean 0.190s) the
  # 19 that reach a second carry 21.7s, just under half the 45.2s of test
  # time, and the other 219 carry 23.5s between them. That tail is deliberate
  # and it is spread across three suites, so it is not a thing to lift out —
  # and lifting ALL of it would still leave `rooms` as the gate.
  #
  # Which is the whole argument, and it does not depend on which suite you
  # pick. `rooms` is 5.2s behind. Move the biggest one out and `agents` lands
  # at ~43s, at which point the pole is `rooms` at 52.8s and every further
  # second taken out of `agents` buys the gate nothing. The prize is 5.2s,
  # once, whoever pays it.
  #
  # Against a floor of ~10s. Checkout plus `npm install -g bats` is the ~4s the
  # banner above quotes and that part holds (measured: 1.7s + 2.7s), but a JOB
  # costs more than its steps — ~2s from `created_at` to `started_at`, ~1s
  # before the first step runs, 0.6s of "Set up job", ~2s from the last step to
  # the job closing. Ten seconds of runner and a fifth boundary every future
  # suite has to be routed through, to buy five seconds of gate. No.
  #
  # The rule that generalises out of this — measure the GAP between the pole
  # and the job behind it, never the pole alone — is rule 5 of the family's CI
  # rules, the workshop's docs/ci.md, and the stamped figures are in its
  # script/probes/README.md. Kept there rather than restated here: what this
  # comment owes a reader is the arithmetic for THIS repo.
  #
  # ⚠️ It also retires a trigger. The nix half's banner says to re-open the
  # narrower-store question "when the POLE shell job gets under 40s" — which no
  # split can deliver, because `rooms` floors this half at ~53s. `draw`'s idle
  # 22s has since been taken out (below), and that is the shape of the point
  # rather than a counter-example to it: it put `draw` under 40s and moved the
  # POLE not at all. The only other route is the per-test overhead, which is
  # not a job boundary either.
  #
  # ⚠️ `draw`'s 53s was never 53s of work, and a suite compared against it was
  # being compared to a clock rather than to a cost. Its `rebuild fix CTA` step
  # reported all 38 of its tests ok at 10.3s and then closed at 32.3s: the
  # "haus rebuild does not wait for the answer" case stubs `trill` as a
  # `sleep 30`, the detached holder under test outlives the test BY DESIGN —
  # that is the case — and the orphan inherited bats' fd 3, which is a dup of
  # this STEP's stdout, so the step could not close until the sleep ended. The
  # signature was 32s ± 1s across all ten runs while the work inside them
  # varied. `test/rebuild-fix-cta.bats` now closes fd 3 in the shell it
  # detaches from, which costs the case nothing — the holder still outlives its
  # caller — and `draw` is a ~31s job. That changes NOTHING above: `rooms` is
  # what `agents` is measured against either way. Headroom, not a win, and the
  # table row stays as it was measured.

  lint:
    name: shell lint
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      # bootstrap.sh is the standalone curl|bash installer — the one shell
      # script here that isn't a nix template (@PLACEHOLDER@ substitution) or a
      # zsh sketchybar plugin, so it's the one we can lint as-is. Warning level
      # catches real bugs (undefined vars, bad quoting) without failing on
      # info-level style nits. It's what hausfold.co/hacker.sh serves, so a
      # regression here reaches every new installer.
      - name: shellcheck
        run: |
          # shellcheck comes from the runner image — no install step. Print the
          # version so a future image change that drops it fails loudly here
          # rather than as a confusing "command not found" mid-lint.
          shellcheck --version
          # bootstrap.sh reaches every new installer via hausfold.co/hacker.sh;
          # haus.sh + awake.sh ship onto every machine as end-user CLIs.
          # haus-activate.sh joins them: it is the privileged half of every
          # rebuild, runs as root, and its one message is the one a user sees
          # when an activation fails — the worst line in the set to have a
          # syntax error in.
          # statusline-refresh.sh is linted for a different reason: it runs
          # DETACHED with its output discarded, so a non-zero anywhere in it is
          # completely invisible — the bar just quietly stops updating.
          # test/haus-settings.sh is linted here and RUN in the `acquire` job.
          # ⚠️ It was linted and NEVER run — every day of the six weeks between
          # #252 and here — on a reason that was never true: "it evaluates a
          # darwinConfiguration, so this runner can never execute it". #762
          # disproved it; this change retired it by
          # taking the lint off and looking: it passes on ubuntu-latest, cold,
          # unchanged. The step there carries what it cost and why it sits in
          # that job. The durable lesson is the shape of the mistake: a
          # plausible reason written down once was read as a measurement by
          # everyone after, and nobody ran the command that would have taken
          # ninety seconds to answer it.
          # test/haus-plan.sh is linted here and RUN in the `rooms` job: its subject
          # pure parsing over fixture files, so it needs neither Nix nor a Mac.
          #
          # These paths are hand-written, so MOVING a script silently drops it
          # from the lint — except that shellcheck exits 2 on a path it can't
          # open, which makes the rot loud rather than silent. That is exactly
          # how the `modules/core/` → `modules/ai/` move in #402 surfaced: the
          # job had been failing on it, invisibly, behind the apt stall this
          # commit's parent removed. Move a script, fix the path here.
          # scruff-cache.sh and lanes.sh join for statusline-refresh.sh's reason.
          # scruff-cache's whole job is to run DETACHED with its output discarded
          # (`scruff-cache kick`), so a non-zero in it is invisible and the bar and
          # the Lanes picker simply go on serving a cache nothing refreshes.
          # lanes.sh is the palette command a person opens by hand, but its
          # stderr goes to the pounce daemon and nowhere a user looks, so a
          # broken row build reads as "the palette closed itself" — which is
          # exactly the bug #430 was opened for. Both are plain bash with no
          # @placeholder@ substitution, so they lint as-is.
          # modules/launcher/commands/lib/menu-commit.sh joins for barlib.sh's
          # reason: it is the sourced parse under every palette menu and the
          # bar's haus menu, and everything it gets wrong is a menu that
          # silently does nothing.
          # lane-seen.sh joins lane-cwd.sh in the list for the same reason and one
          # more: AeroSpace runs it detached on EVERY focus change
          # (`exec-and-forget`), so nothing it prints or returns reaches anyone
          # — a broken one is a lane fin that simply never comes down.
          # modules/core/haus-notify.sh and modules/core/trill.sh are the whole
          # desktop's notification path — every banner haus draws goes through
          # one of them, from a bar plugin, a launchd job or a pounce command,
          # and every call site ends in `>/dev/null 2>&1` because a courtesy
          # must not fail its caller. That redirection is exactly why they earn
          # the lint: a broken one is invisible by construction. haus-notify is
          # a @placeholder@ template and lints anyway, for focus.sh's reason —
          # `TRILL="@trill@"` is an assignment right-hand side, so an
          # unsubstituted copy still parses.
          # modules/bar/sketchybar/barlib.sh is the bar widget RUNTIME: every
          # framework pill sources it, and everything it gets wrong is
          # invisible by construction — a widget's stderr goes to sketchybar's
          # log and nowhere a person looks, so a broken runtime is a pill that
          # simply stops painting. The widgets themselves are deliberately NOT
          # here: fetch() emits state that render() reads as variables, so
          # every one of them trips SC2154 by design (ops/todo/bar-framework.md).
          # modules/focus/focus.sh IS a @placeholder@ template and lints anyway:
          # every substitution in it sits on the right-hand side of an
          # assignment, so an unsubstituted copy is still valid shell. It earns
          # the lint for statusline-refresh.sh's reason, twice over — since
          # haus.focus.scenes.<name>.when it also runs from launchd on a timer,
          # where a non-zero is not just invisible but silently stops your Mac
          # entering the scenes you declared.
          # modules/ai/fix.sh is `haus fix` — it runs an agent with its
          # permission gate open, in the user's config flake, usually spawned
          # from a trill pill with no terminal anywhere near it. Nothing it
          # prints reaches a person; the only thing that does is the banner it
          # ends on, so a script that died before drawing one is a "Fix it"
          # button that visibly does nothing. It is a @placeholder@ template and
          # lints anyway, for haus-notify.sh's reason: all three substitutions
          # are assignment right-hand sides, so an unsubstituted copy still
          # parses (@uiSh@ joined them as `local sh="${HAUS_UI_SH:-@uiSh@}"`).
          # modules/secrets/haus-secret.sh joins for focus.sh's reason and
          # awake.sh's together: it is a @placeholder@ template whose four
          # substitutions are all assignment right-hand sides, so it lints
          # unsubstituted; and it is an end-user CLI that launchd agents also
          # exec at boot to read a value, where a non-zero is a room starting
          # without its secret and nothing on screen to say so.
          shellcheck --severity=warning modules/secrets/haus-secret.sh bootstrap.sh modules/ai/fix.sh modules/ai/fix-github.sh modules/core/haus-notify.sh modules/core/trill.sh modules/core/haus.sh modules/core/haus-show.sh modules/core/haus-activate.sh modules/core/awake.sh modules/core/haus-bar-poke.sh modules/core/lidawake.sh test/lidawake.sh modules/core/nix-gc.sh modules/ai/statusline-refresh.sh modules/ai/desktop-guard.sh modules/terminal/lanes/lane-cwd.sh modules/terminal/lanes/lane-seen.sh modules/terminal/lanes/lane-focus.sh modules/terminal/scripts/raise-session.sh modules/windows/scripts/fullscreen-toggle.sh modules/focus/focus.sh test/awake.sh test/focus-auto.sh test/focus-timer.sh test/focus-engine.sh test/haus-settings.sh test/haus-plan.sh test/haus-show.sh test/haus-add.sh test/brew-fault.sh modules/ai/scruff-cache.sh modules/launcher/commands/lanes.sh modules/launcher/commands/lib/menu-commit.sh modules/ai/runtime/tart-adapter.sh script/build-golden-vm.sh modules/ai/statusline.sh modules/github/signal.sh modules/terminal/scripts/image-preview.sh modules/terminal/lanes/lane-open.sh modules/bar/sketchybar/barlib.sh modules/bar/sketchybar/plugins/edge.sh

  draw:
    name: shell suites that draw
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      # From npm, never apt — the account is above `lint`.
      - name: bats
        run: sudo npm install -g bats
      # snug's `share/ui.sh` — the painter every script in this repo draws
      # through — at the rev this repo's flake.lock pins. One file over https,
      # not a clone and not Nix, so this job stays the cheap one it is.
      #
      # Fetched rather than stubbed on purpose. A fixture would make the
      # integration green while checking nothing, and this family has already
      # been bitten by exactly that: the drift test between ui.sh and palette.go
      # skipped silently on any machine without the second checkout. The real
      # file at the pinned rev is the only thing that catches a renamed role or
      # a moved function before somebody's rebuild does.
      - name: snug's painter, at the pinned rev
        run: |
          rev="$(jq -r '.nodes.snug.locked.rev' flake.lock)"
          [ -n "$rev" ] && [ "$rev" != null ] || { echo "no snug rev in flake.lock"; exit 1; }
          mkdir -p "$RUNNER_TEMP/snug"
          # Retried: one CDN hiccup must not red a suite that is otherwise
          # bash + python3 + bats, and `-f` alone gives up on the first 5xx.
          curl -fsSL --retry 3 --retry-all-errors --retry-delay 2 \
            "https://raw.githubusercontent.com/hausfold/snug/$rev/share/ui.sh" \
            -o "$RUNNER_TEMP/snug/ui.sh"
          echo "HAUS_UI_SH=$RUNNER_TEMP/snug/ui.sh" >> "$GITHUB_ENV"
      #
      # ⚠️ Every suite below reads what that step just wrote, and that is the
      # whole reason they are a job together. Inside the old single job this
      # was a comment asking a reader to keep the fetch above them, and
      # getting it wrong did not merely weaken a suite: statusline.bats's
      # colour-gate cases assert cube escapes and go RED, while its six band
      # cases SKIP, which reads as six passes. A runner has no `snug` on PATH
      # and no /run/current-system, so there is nothing else for them to find.

      # The render path's counterpart suite. Its subject is the Fable/Mythos row
      # tint, whose correctness is a WIDTH invariant across rows that carry both
      # SGR and OSC 8 — so it breaks silently whenever a segment is added, and
      # the breakage reads as a terminal quirk rather than a bug. Same hermetic
      # shape again; needs only git + jq + bats.
      - name: statusline render tests
        run: bats test/statusline.bats

      # The `haus rebuild` phase painter and the colour gate both end-user CLIs
      # grew with it. Three silent failure modes: a record `snug run` cannot
      # parse is a line that simply never appears; a repaint that assumes a
      # width corrupts the screen only on a window narrower than the author's
      # (52 columns and below for the finished `activate` row, 13 and below for
      # the running one — measured in real ptys, which is what the last tests
      # here build); and an ungated escape is invisible to anyone watching
      # colour. Needs bash + python3 + bats + the file fetched above, no Nix and
      # no Mac.
      - name: phase painter and colour gate
        run: bats test/phase-painter.bats

      # The one PERMANENT exemption from that standard, and the only thing
      # keeping it honest. bootstrap.sh and haus-activate.sh run before snug is
      # reachable, so they carry nebelung's numbers inlined instead of naming a
      # role — a copy of a generated table, which drifts the moment the palette
      # moves and drifts INVISIBLY: a wrong index is green everywhere and only
      # ever visible to someone holding the two files side by side. Diffs both
      # against the ui.sh fetched above, so it must stay below that step too.
      - name: installer palette, against snug's
        run: bats test/installer-palette.bats

      # `haus-secret` — the listing a person reads BEFORE they have a working
      # machine (`haus doctor` sends them here), and the one CLI in this repo a
      # launchd agent also exec's at boot. Both halves fail quietly: an unfolded
      # `why` soft-wraps back to column 0 and reads as the next entry, and a
      # painter that loads where it should not costs every room a thousand lines
      # of bash for a value it prints on fd 1. The degradation cases are the
      # point of the build-time substitution, so this suite takes HAUS_UI_SH out
      # of its own environment — it must still stay below the fetch, because the
      # painted cases want the real file. Needs bash + python3 + bats.
      - name: haus-secret's listing and its two streams
        run: bats test/haus-secret.bats

      # `awake` — the CLI that is also a DATA SOURCE. `status` is its default
      # verb and prints prose for a person, but the same script answers the
      # bar's coffee pill on every tick through `status --raw`, and one escape
      # or one glyph in those three tab-separated fields breaks the pill with no
      # error anywhere. So this suite guards both directions at once: the
      # sentence got a mark and roles, and `--raw` and `_run` never so much as
      # source the painter. It stays BELOW the fetch because the painted cases
      # want the real file. Needs bash + python3 + bats.
      - name: awake's sentence, and the raw fields it must not touch
        run: bats test/awake-ui.bats

      # The "Fix it with AI" CTA on a failed `haus rebuild`: the breadcrumb the
      # rebuild leaves for `haus fix`, the four gates in front of the offer, and
      # the detached holder that has to outlive the window the rebuild ran in.
      # Every part of it fails silently — a renamed crumb key answers "nothing
      # to fix" for a rebuild that failed in front of you, an inverted gate
      # offers a fix nothing can honour, and a holder that merely backgrounds
      # looks identical until someone closes the terminal.
      #
      # ⚠️ MUST stay below "snug's painter, at the pinned rev" — three cases
      # drive `haus-fix` on a pty and `skip` when no ui.sh is found, and a skip
      # reads as a pass. Needs bash + git + bats + python3 (the pty), and perl
      # for the one SIGHUP case (skipped without it).
      - name: rebuild fix CTA
        run: bats test/rebuild-fix-cta.bats

  agents:
    name: shell suites, the agent surface
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      # From npm, never apt — the account is above `lint`.
      - name: bats
        run: sudo npm install -g bats
      # The refresher is `scruff`'s reader, and it fails in the one way nobody sees:
      # it runs detached under `set -e`, so any non-zero leaves the LAST panel.tsv
      # in place and the bar keeps showing worktrees that were reaped hours ago —
      # no error, no empty bar, just a confidently stale one. Same hermetic shape
      # as scruff's own acceptance suite (throwaway repos, shim gh, redirected cache).
      - name: statusline refresher tests
        run: bats test/statusline-refresh.bats

      # The warm `scruff --json` both the agents pill and the Lanes palette read
      # instead of running scruff on a hot path. Every verb in it is an age, so
      # a cache file stamped AHEAD of `now` — a clock stepped backward, a VM
      # resumed from a snapshot — reads FRESH rather than stale and both
      # consumers serve lane rows nothing is refreshing, silently and forever.
      # `path`, `age` and `read` only: `kick` prepends the system bin dirs
      # before it looks for `scruff`, so it can be neither shimmed here nor run
      # on a runner that has no scruff at all. Needs only bash + bats.
      - name: scruff cache tests
        run: bats test/scruff-cache.bats

      # The PreToolUse guard, whose two failure modes are both silent and both
      # bad: prompting for something the user cannot see (a lane's headless VM
      # over ssh) trains click-through on the prompts that matter, and missing a
      # real one lands as a window jumping in front of them mid-sentence.
      # Neither a build nor a lint can see either. Pure function, no Mac needed.
      - name: desktop guard tests
        run: bats test/desktop-guard.bats

      # `haus-vm-shot`'s capture path. Its whole output is consumed by a `$( )`
      # and published into a pull request, so its failures are ones nobody
      # reads: a stray line on stdout, a capture without `-x`, the wrong lane's
      # VM, a PNG left on the guest, a failure that still printed a path.
      # tart/ssh/scp are stubbed, so no VM and no Mac.
      - name: vm-shot tests
        run: bats test/vm-shot.bats

      # The other half of the same adapter: standing a lane's guest up and
      # getting a shell in it. Every failure it pins looks like a working
      # machine from the outside — a `runtime up` that never returns because the
      # guest inherited the caller's stdout, an address reported before sshd
      # answers on it, a known_hosts entry that refuses the next lane to land on
      # a reused address. That is what hausfold/haus#663 cost two sessions.
      - name: vm-runtime tests
        run: bats test/vm-runtime.bats

      # `haus skill` and `haus get --json` — A3 and A2 of the family
      # agent-surface standard, and both are surfaces only an agent reads, so
      # every way they break is silent: printing the UNRENDERED template puts
      # `@hausVersion@` in front of a user and points an agent at option docs
      # that were never generated; `skill install` meeting the read-only Nix
      # symlinks haus itself put there has to refuse in words, because an agent
      # that reads EPERM reaches for sudo; and a bare-value `--json` cannot tell
      # "nothing defines this yet" from "defined as null", which is exactly the
      # pair `haus unset` makes. Hermetic: a fixture skill dir, a fixture HOME,
      # nix stubbed out. Needs bash + bats + jq, no Nix and no Mac.
      - name: the agent surface (haus skill, haus get --json)
        run: bats test/agent-surface.bats

      # The `autoMode` block of ~/.claude/settings.json — the four lists of
      # prose Claude Code's safety classifier judges every tool call against,
      # and the one haus surface whose failures are measured in refusals that
      # stopped happening rather than in anything on screen. It had no test at
      # all until the section-clearing fix; what it needs one for is that both
      # directions are silent: a merge that takes too much deletes a `hard_deny`
      # somebody wrote with `claude auto-mode`, and a merge that takes too
      # little leaves an `allow` rule lifting refusals for a config that stopped
      # asking for it (measured on a guest, 2026-09-21). Runs the real
      # modules/terminal/claude-settings.jq, and the activation's shell half
      # lifted out of modules/terminal/default.nix rather than retyped. Needs
      # bash + bats + jq, no Nix and no Mac.
      - name: Claude Code auto-mode sections
        run: bats test/claude-auto-mode.bats

      # `haus set`'s ADDRESS — which option path the verb can name, how that
      # path becomes Nix, and what it says when a write takes more than it was
      # given. All three failed silently, and two of them failed for real: the
      # grammar refused the `:` every `haus.launcher.items` key carries, so no
      # palette item was reachable from the verb and the refusal read as a typo;
      # `settings_attrpath`'s bare-identifier glob then left such a key UNQUOTED,
      # making the file haus had just written a Nix syntax error; and a
      # whole-attrset write is `mkForce`, so naming the enclosing set withdrew
      # the five items haus defines while the command printed the new value and
      # stopped. The end-to-end half is test/haus-settings.sh, which runs in
      # the `acquire` job — it needs a real nix, this suite does not. Needs
      # bash, bats and jq, no Nix and no Mac.
      - name: haus set's option address
        run: bats test/settings-key.bats

      # The github pill's "Fix with AI" rows, BOTH halves — the fetch that
      # writes `<verdict>:<target>` into the cache (github.sh's own jq, lifted
      # and run) and the runner that is handed it (modules/ai/fix-github.sh:
      # the URL→owner/repo parse, the per-verdict brief, the lane name, the
      # client pick, and resolve_repo over a throwaway filesystem). One suite
      # because the cache field is a contract between two files and nothing
      # else joins them: a verdict word spelled one way in the jq and another
      # in the split is a button that never draws, with no error on either
      # side. Everything else here fails the same way — LANE SPAWNED ON THE
      # WRONG BRIEF (an owner/repo from the wrong path segments, a branch
      # selector read as a PR number, a colon-joined root list walked
      # line-wise) — and all of it produces a working lane a feel-test cannot
      # catch. Needs bats, git and jq.
      - name: github pill fix rows
        run: bats test/fix-github.bats

      # The GitHub bridge's consumer contract — `haus_gh_covers` and the
      # statusline gate it feeds. Every failure in this seam is silent AND
      # expensive in one direction: a coverage answer of "yes" when it should be
      # "no" turns a 15-second readout into a 30-minute one and the pill just
      # starts quietly lying about a merge that already happened. There is no
      # error path to notice it, so the suite IS the guard, and it has to fail
      # closed on all of: no scopes file, an empty one, a stale one, one repo
      # out of two, an unparsable mtime.
      #
      # It runs statusline.sh, so it used to sit below the painter fetch on
      # principle — and it is here rather than in `draw` because that fetch was
      # never load-bearing for it. The difference is worth stating: it asserts
      # on a BEHAVIOUR (did the render decide to refresh?) and owns no colour
      # cases, so a painter-less run has nothing in it to skip and go quietly
      # green. Measured: 29/29 with HAUS_UI_SH unset and with it pointed at a
      # path that does not exist, which is now simply how it runs.
      #
      # Two flags mean something else on this runner than on the Mac these
      # scripts ship to, which is why signal.sh and the suite both carry the
      # same try-BSD-then-GNU shape statusline.sh has always had. `date -v` does
      # not exist here at all. `stat -f` is --file-system and takes NO argument,
      # so `%m` becomes a second FILE operand: a filesystem block on stdout and
      # exit 1 (measured, coreutils 9.11 — not the "/ and exit 0" three comments
      # in this repo used to claim). Honouring that status answers 0 for every
      # file, which is why every coverage question came back "not covered" here
      # before this. Needs bash + bats.
      - name: github bridge signal tests
        run: bats test/github-signal.bats

  rooms:
    name: shell suites, the rooms
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      # From npm, never apt — the account is above `lint`.
      - name: bats
        run: sudo npm install -g bats
      - name: awake lifecycle tests
        run: bash test/awake.sh

      # lidawake's three failsafes, over a fake pmset and a fake clock. Every
      # one of them is time-dependent and every one fails invisibly: a Mac that
      # quietly stopped sleeping on a lid close looks exactly like a Mac you
      # forgot to close, and the bill arrives as a flat battery in a bag.
      - name: lidawake failsafe tests
        run: bash test/lidawake.sh

      # The weekly store cleanup's survival of a store path macOS will not let
      # go of. One refused chmod on a launched app bundle aborts the WHOLE
      # collection, so the wrapper pins that path and carries on — and every
      # way of getting that wrong is invisible from outside: a loop whose exit
      # condition is "nix stopped complaining" either spins forever, or pins
      # something that isn't a store path and breaks the store it was saving.
      # Faked at two seams (the collector, `xattr`), so it needs no nix, no
      # root and no week.
      - name: nix-gc pins what macOS won't release
        run: bats test/nix-gc.bats

      # THANKS.md's credit list against the tree that is supposed to use each
      # project. A credit list has no consumer — nothing imports it, no build
      # fails when it is wrong — so it rots in the one direction that
      # embarrasses us, which is thanking a project we deleted. That is not
      # hypothetical: the file's first draft credited zellij for holding your
      # sessions three weeks after modules/moved.nix recorded it gone, in the
      # same sentence as the zmx that replaced it. The check is deliberately
      # dumb and says nothing about whether a SENTENCE is still true; it only
      # refuses a credit with nothing in the tree behind it, and a table row
      # left standing after the credit went.
      - name: THANKS.md still credits what haus uses
        run: bats test/thanks-drift.bats

      # The trigger daemon's decisions — which scene rises, which one it may
      # enter, which one it is allowed to leave — over stubbed probes and a fake
      # clock. It is the half of `focus auto` that isn't macOS: the four real
      # probes (pmset, networksetup, hausdisp/system_profiler) are what
      # `focus auto --probe` checks on the Mac itself, and this suite says
      # nothing about them. What it does protect is the rule the whole feature
      # rests on — the daemon never overrides a state you chose — which fails
      # in the worst possible way if it regresses: your Mac quietly disagreeing
      # with you every thirty seconds.
      - name: focus trigger tests
        run: bash test/focus-auto.sh

      # `focus 25` — the fuse. Same split and the same stakes one level down:
      # the decisions are a state dir and a clock, and what they protect is the
      # rule that a timer ends only the quiet it armed. Get that wrong and a Mac
      # un-quiets itself in the middle of something, with nothing on screen that
      # explains why.
      - name: focus timer tests
        run: bash test/focus-timer.sh

      # `haus plan`'s parsers, and the only part of plan CI can execute: they
      # read a BUILT activation script and a home-manager generation, both of
      # which this suite hand-writes as fixtures, so no Nix and no Mac needed.
      # Worth running rather than only linting, because the failure mode they
      # guard against is a preview that says "nothing was changed" about a
      # rebuild that changes something — silence, which no lint can catch.
      - name: haus plan parser tests
        run: bash test/haus-plan.sh

      # What `haus` can see about a cask that did NOT install. Activation now
      # CATCHES a `brew bundle` failure instead of dying on it, so noticing is
      # the whole job: `missing_casks` names the absent app and `haus rebuild`
      # fails on the marker. Pure list arithmetic over a fixture Brewfile and a
      # stubbed `brew`, so no Mac needed — and worth running rather than only
      # linting for `haus plan`'s reason: the bug it guards against is silence,
      # which is exactly what shipped before it.
      - name: brew fault reporting
        run: bash test/brew-fault.sh

      # float-term's `recenter` — the pass that centres a spawned popup on the
      # size it actually is. Pure arithmetic over two rectangles with AX and the
      # screen probe stubbed, so it runs here rather than needing a Mac and a
      # second display, which is what it took to FIND the bug.
      - name: float-term recenter
        run: bats test/float-term-recenter.bats

      # raise-session's lane→window join — the answer to "which window is this
      # agent in?", which a trill banner click, ⌘F's ⏎ and the bar's agent rows
      # all go through. The bug it guards was an awk parse error that only fired
      # once TWO plain windows carried a label, and the runner's awk tolerates
      # the input that kills macOS's — so the suite stubs awk to reproduce
      # one-true-awk's rule, and would pass on the old code without it.
      - name: raise-session lane join
        run: bats test/raise-session-lane-join.bats

      # The other half of that click: the fullscreen ON take, which is <mod>f's
      # body and what a trill fin's raise reaches through --fullscreen. Both
      # rules it keeps fail SILENTLY — the solo-window guard arms a mode that
      # hides the next window to open on that page; counting the window's OWN
      # page rather than the focused one is what keeps a raise that missed from
      # arming the mode somewhere you are not. Plus raise-session's flag loop,
      # which every existing caller runs through with both streams redirected
      # away. Hermetic: aerospace and the bar's notify hook are recorders.
      # Needs only bash + bats.
      - name: fullscreen take
        run: bats test/fullscreen-take.bats

      # The zmx wire-format reader — the one parse of `zmx ls`/`zmx get`
      # everything reads through (three rooms; ~10 hand parses replaced).
      # Every trap it owns fired silently in production first: the attached
      # marker glued to the first key, the 0.7.0 start_dir rename, and `zmx
      # get`'s tab→space flip that left both label helpers answering empty.
      # Hermetic: zmx is a fixture behind HAUS_ZMX_BIN, because the subject's
      # own PATH prelude would beat a PATH stub on a real machine. Needs only
      # bash + bats + awk.
      - name: zmx-rows reader
        run: bats test/zmx-rows.bats

      # The other end of that same fact: raise-session subtracts a mistitled
      # plain window AFTER it exists, new-window.sh refuses to create one. Both
      # halves stay — Ghostty's own New Window menu item can still put a window
      # in a lane's process — but the refusal is what stopped ⌘T, ⌘N and ⌘⇧N
      # handing out shells named `scruff.<repo>.<lane>`. Silent either way: a
      # mistitled window opens perfectly and the only symptom is its name.
      - name: new-window forced-title refusal
        run: bats test/new-window-title.bats

      # The Ghostty cold-start pre-warm, across the three scripts that carry it
      # — and the two that deliberately don't. `pgrep -x Ghostty` matches
      # nothing (the executable in the bundle is lower-case), and it was wrong
      # in two files at once until #415, costing every ⌘N and every lane spawn
      # two seconds of polling for a process already up, with nothing anywhere
      # reporting it. A diff between the copies was green throughout — they were
      # wrong identically — so this pins the invariant instead: the spelling,
      # the 40 × 0.05s ceiling, and the guard. Needs only bash + bats + awk.
      - name: ghostty pre-warm
        run: bats test/ghostty-prewarm.bats

      # A background lane spawned while the screen is asleep. Ghostty cannot
      # build a surface when macOS reports zero active displays, and
      # lanes/lane-open.sh IS the lane's --initial-command — so the window came
      # up as an error pane, the script never ran, and the lane had no session,
      # no client and not even a fault banner, while `scruff spawn` exited 0 and
      # the palette reported it working. Three lanes were lost that way inside
      # ninety seconds before anyone looked at the windows. Pins the display
      # gate, the windowless path's create-or-bail, zmx's flag order, and the
      # probe that now asks whether a CLIENT started rather than whether a
      # process is alive. Needs only bash + bats.
      - name: a lane with no display
        run: bats test/lane-no-display.bats

      # Where a lane's WINDOW PROCESS stands. A lane spawned by an agent running
      # `HAUS_LANE_BACKGROUND=1 scruff spawn` from its own shell — the spelling
      # modules/ai/default.nix hands every agent here — left its Ghostty holding
      # the SPAWNING lane's checkout as its cwd, because a direct exec inherits
      # one and a GUI process keeps it for the life of the window. scruff reads
      # occupancy with `lsof -d cwd`, so `scruff reap` then refused to sweep a
      # landed lane and named a ghostty pid whose only cure was closing the
      # window of the lane it had spawned. The launch is lifted out of the
      # subject and RUN against a stub that records its own cwd, with a control
      # arm that removes the `cd` and watches the assertion fail. Needs only
      # bash + bats.
      - name: where a lane's window is born
        run: bats test/lane-spawn-cwd.bats

      # The launchd wait every GUI agent starts behind — the bar (twice),
      # AeroSpace and pounce. Its second loop used to be an Apple event to
      # System Events, which macOS filed under /bin/bash, so a fresh machine's
      # first impression was a modal naming a shell, with nothing drawn behind
      # it because all four agents were blocked in that loop. Refusing it cost
      # more than the prompt: a denied Apple event sits out a two-minute
      # manager timeout in the `until` CONDITION, which the deadline check in
      # the body only runs between, so AeroSpace exec'd 125 s into every login
      # instead of 65. Pins what fixed it — the Apple event gone, the deadline
      # read once per loop, a probe that waits for a NAME rather than for the
      # non-empty `[ NULL ]` line the null ASN answers with, the settle moved
      # into the shared script so pounce gets it too, and the argv[0] the second
      # bar is named after. Needs only bash + bats + awk.
      - name: gui-wait
        run: bats test/gui-wait.bats

      # `haus report` — the door to the one feedback channel anything we ship
      # has, and every way it breaks leaves a working-looking command behind: a
      # `body=` prefill opens GitHub's blank editor and files a shapeless report
      # with no error, a lax encoder turns every `+` in the block into a space,
      # a redaction that stops firing publishes a username, and past the length
      # cap the form opens empty. Hermetic: a fixture consumer flake, and every
      # stub a function (haus.sh puts the system profile on PATH ahead of any
      # directory a test could add). Needs bash + bats + jq, python3 for one
      # round-trip case, no Nix and no Mac.
      - name: the bug-report door
        run: bats test/report-door.bats

      # `haus version` and what `haus status` says about the pin — the two
      # answers to "which haus is this?", and both failed while looking like
      # they worked. There was no version verb at all, so the first thing anyone
      # types at a CLI they have just met got `unknown command` and thirty other
      # verbs. And `git ls-remote <url> <tag>` answers an ANNOTATED tag with the
      # tag OBJECT while the lock pins the commit it peels to, so a tag-pinned
      # config — `script/build-golden-vm.sh` writes one, and so does any consumer
      # who wants a stable pin — was told "a newer haus is available upstream" on
      # every run by a status that `haus update` flatly contradicted. The third
      # case here is the one nobody would have gone looking for: with no network
      # the probe's own non-zero ended the whole command mid-draw, under a
      # comment promising it was offline-safe. Hermetic: a fixture lock, git a
      # shell function. Needs bash + bats + jq, no Nix and no Mac.
      - name: the version verb and the pin comparison
        run: bats test/version-and-pin.bats

      # The background-jobs deck's READERS. `nix flake check`'s `services-deck`
      # pins the deck's completeness — every launchd job has an entry — and
      # knows nothing about what the CLI then does with the file, which is where
      # a wrong answer costs something: a false red line also fires the BTM card
      # in the permissions deck, and a false green hides a job that has stopped
      # working. The case it exists for is `last exit code = (never exited)`,
      # which launchd prints for a job with `runs = 0` — a present field that is
      # not a number, and so "failed" to any reader testing non-empty-and-not-0.
      # `launchctl` is faked as a shell FUNCTION rather than a stub on PATH,
      # because haus.sh prepends its own PATH at load and would shadow a stub.
      # Needs bash + bats; no painter, so it can sit anywhere.
      - name: the services deck's probe, verdicts and record encoding
        run: bats test/services-deck.bats

      # The permissions deck's other half, one card down: whether the palette's
      # Accessibility card can tell a granted DAEMON from a granted terminal.
      # `pounce --check-accessibility` cannot — AXIsProcessTrusted() is answered
      # for the process responsible for the shell that ran the CLI — so the card
      # drew a green tick on every Mac whose terminal held the grant while
      # pounce held nothing and every chord was dead. A false green nobody looks
      # behind, found on a fresh VM and invisible to `nix flake check`, which
      # type-checks the card and never reads what the snippet means. The stub
      # answers the CLI flag and the daemon's report separately, so the case
      # that matters is the one where they disagree. Needs bash + bats + awk
      # + jq — the snippets under test pipe into it; no painter.
      - name: the palette's Accessibility card reads the daemon
        run: bats test/launcher-accessibility.bats

      # `haus-bar-poke` — the both-bars trigger, and the one place that rule
      # lives now that four producers call it instead of writing the pair out.
      # SketchyBar keys its lock file and its mach service on
      # `basename(argv[0])`, so a `--trigger` reaches exactly ONE instance:
      # poking the top bar alone is valid syntax, exits 0, logs nothing, and
      # freezes a pill that `haus.bar.bottom.items` moved downward. The other
      # half is the no-op contract — three rooms call this on their SUCCESS
      # paths, so a machine with no bar, a missing bottom binary or a bar
      # mid-reload must never make a focus toggle or an `awake 1h` report
      # failure. Hermetic: a recorder at each bar path. Needs only bash + bats.
      - name: the both-bars poke
        run: bats test/bar-poke.bats

      # Which Trill.app the `trill` on PATH resolves to. A precedence with no
      # error surface: every candidate is a real, working Trill, so the wrong
      # one costs nothing at the call site and runs a stale daemon forever —
      # a dev build in ~/Applications used to outrank the bundle
      # `haus.notifications.compositor` pins at /Applications, and no rebuild
      # could displace it. Asserts the order in each of the three files that
      # spell it out (the wrapper, haus.sh's `trill_bin`, the bar's trill pill),
      # so one cannot drift from the others silently. Hermetic: fake bundles in
      # a tmpdir, the subject's absolute paths repointed into it. Needs only
      # bash + bats.
      - name: trill bundle precedence
        run: bats test/trill-precedence.bats

      # The bar widget runtime (ops/todo/bar-framework.md). Every promise barlib
      # makes fails silently on a live bar: a diff that never settles repaints
      # a quiet pill forever, one that over-matches freezes a pill on stale
      # data, and a --hide without updates=on is a pill no event can bring
      # back — the one-way door the framework exists to close. Hermetic: fake
      # $HOME, a recorder standing in for sketchybar. Needs only bash + bats.
      - name: barlib runtime tests
        run: bats test/barlib.bats

      # The page pill's fraction. It counts PLACES — a workspace with a window
      # on it — out of one `aerospace` call that treats the two kinds
      # differently: a page is non-persistent and so listed only while it is
      # live, while the base (`T`) is persistent and listed whether or not
      # anything is on it. `--empty no` is the whole of what makes them
      # comparable, and every way to get this wrong draws a plausible number
      # nobody can check, or hides the pill in the one state it exists for: an
      # emptied `T` whose pages nothing else on screen mentions. Hermetic: fake
      # $HOME, aerospace and sketchybar as recorders, the subject's PATH prelude
      # rewritten so a real Mac's workspaces cannot answer. Needs only bash +
      # bats.
      - name: page pill count
        run: bats test/page-pill.bats

      # The aiUsage pill's weekly SUB-limits. A Max plan caps some model
      # families inside the weekly window rather than beside it, so a family can
      # be spent for the week while the weekly gauge it lives in reads 50% — a
      # number the bar shows WRONG rather than not at all, which no glance
      # catches. The other half is freshness: the nine-column row beside these
      # is pushed by every render while these are only pulled, so a sub-limit
      # riding its neighbour's stamp onto the pill is the first bug back.
      # Hermetic, same harness as barlib's, and it shims `date -r` because that
      # spelling is BSD and the runner is not.
      - name: aiUsage sub-limit tests
        run: bats test/ai-usage-limits.bats

      # lane-seen's other half of that join, read backwards: the focused
      # window's session name back to the trill key scruff gave that lane's fin.
      # The boundary between `<repo>` and `<lane>` cannot be found in the string
      # — `hausfold.co` is one of ours — so it comes from scruff's registry, and
      # the failure mode of getting it wrong is silent: `trill resolve` is
      # idempotent, so a wrong key exits 0 and the fin just stays up.
      - name: lane-seen key join
        run: bats test/lane-seen.bats

      # The one parse of a pounce stdin-menu answer, over fixture commit
      # strings — "<action>\t<raw-row>", the shape every picker's reply wears.
      # The bug it pins shut is silent by construction: a case on the ANSWER's
      # first field compares every row against the literal "enter" and the
      # menu does nothing at all. Also counts the seven consumers, so an
      # eighth private parse cannot land quietly. Needs only bash + bats.
      - name: menu commit parse
        run: bats test/menu-commit.bats

      # Spawn Agent's field reading. `--dial` gives the prompt step a commit
      # one field wider than every other step's, and BOTH ways of misreading it
      # produce a lane rather than an error — a task silently shortened by its
      # first line, or a task briefed with a stray "agent=pi" on the front. A
      # feel-test cannot see either, because both spawn. Also pins the client
      # list, which is built from PATH rather than from haus.ai.clients so that
      # nothing the ⇥ chip offers can fail to start.
      #
      # And the lane NAME beside it, which fails the other way round. The slug
      # goes over as `--derived-name`, which is scruff's word for "the caller
      # worked this out from the task" — so scruff cuts it to what the lane key
      # can carry (its `name_max`, SPEC.md §5.7) instead of refusing it the way
      # it refuses a name someone TYPED, which is what a positional slug is and
      # what used to cost the whole spawn. So the cases pin the composition that
      # is still haus's taste, and that the name never goes in positionally
      # again — with no budget arithmetic on this side to get wrong.
      - name: spawn-agent field reading and lane naming
        run: bats test/spawn-agent.bats

      # Which lanes the Lanes picker offers. It drops the ones with no pane of
      # their own — a `scruff child` checkout resumes into the pane that made
      # it, so opening one here starts a client where no conversation lives.
      # Every way of getting that wrong hides something real and shows nothing:
      # filtering on `parent` rather than scruff's `chat` would hide a lane
      # opened with ⌘↵ from inside another pane, which is a running agent with
      # a window; treating an absent `chat` as "no chat" empties the picker
      # against an older scruff. The picker still opens either way — it is the
      # missing row nobody notices.
      - name: lanes picker row filter
        run: bats test/lanes-picker.bats

      # The mail watcher's five decisions (modules/notifications/mail-announce.py).
      # Every one of them fails silently, and in both directions — too many
      # cards or none at all: the flood guard that has to answer "nothing" for
      # a mailbox this Mac has never watched (goimapnotify runs the hook once
      # at startup, and launchd starts the agent at every login); the same
      # guard across a UIDVALIDITY change, and its counterpart that must not
      # keep the old watermark past one, which is what would put every later
      # message below the line for good; the RFC 2047 decode that is the
      # difference between a subject and `=?UTF-8?B?…?=`; and the mailbox-name
      # slug the watermark file is named for, which is `[Gmail]/All Mail` on
      # the account this was built for. Hermetic: none of the five opens a
      # socket, which is why they are the five that were split out. Needs bash
      # + bats + python3.
      - name: mail watcher decisions
        run: bats test/mail-announce.bats

      # The other half of the same subject, and the half nothing else covers:
      # the announcer driven end to end against test/fake-imap.py — a real
      # socket, a real TLS handshake and a real imaplib. Everything between
      # those decisions and the card is a response SHAPE (EXAMINE's
      # UIDVALIDITY, the untagged SEARCH list, `FETCH *`'s sequence-numbered
      # UID, a header literal with X-GM-THRID glued to the front), and a wrong
      # parse there is not an error anywhere — it is a Mac that stopped
      # mentioning mail. TLS rather than plaintext deliberately: a fake that
      # skipped it would have needed a plaintext seam in the production code,
      # whose failure mode is a mailbox password crossing a network in the
      # clear. Needs bash + bats + python3 + openssl.
      - name: mail watcher, end to end over TLS
        run: bats test/mail-imap.bats
