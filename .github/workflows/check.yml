name: check

on:
  push:
    branches: [main]
  pull_request:
  # Let a branch be checked on demand (e.g. before opening a PR) without
  # having to push to main first.
  workflow_dispatch:

jobs:
  eval:
    name: eval the example host
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: DeterminateSystems/nix-installer-action@main
      # Pure evaluation of the full darwin system — catches syntax errors, bad
      # option names, and broken module wiring before any consumer does. (Eval
      # is platform-independent; no macOS runner needed until we *build*.)
      # aarch64 only: nixpkgs 26.11 dropped x86_64-darwin, so there's no Intel
      # example left to eval (see flake.nix `allSystems`).
      - run: nix eval .#darwinConfigurations.example.system.drvPath
      # The pure-lib checks (theme-variants, keymap) are declared for Linux too
      # precisely so they can run HERE — they pin the flavor/contrast → themes-subdir
      # table and the keys.* → chord/glyph table as golden files, both of which mirror
      # a rule that lives in another repo or in a generated dotfile, where drift is
      # silent. Without this line they were declared and never executed. The
      # darwin-only `presets` check is guarded, so this builds just those two.
      - run: nix flake check

  shellcheck:
    name: shell scripts
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      # bootstrap.sh is the standalone curl|bash installer — the one shell
      # script here that isn't a nix template (@PLACEHOLDER@ substitution) or a
      # zsh sketchybar plugin, so it's the one we can lint as-is. Warning level
      # catches real bugs (undefined vars, bad quoting) without failing on
      # info-level style nits. It's what nebelhaus.com/init.sh serves, so a
      # regression here reaches every new installer.
      - name: shellcheck
        run: |
          sudo apt-get update && sudo apt-get install -y shellcheck bats
          # bootstrap.sh reaches every new installer via nebelhaus.com/init.sh;
          # haus.sh + awake.sh + wt.sh ship onto every machine as end-user CLIs.
          shellcheck --severity=warning bootstrap.sh modules/den/haus.sh modules/den/awake.sh modules/den/wt.sh test/awake.sh
      - name: awake lifecycle tests
        run: bash test/awake.sh
      # `wt` is the one CLI here whose failure mode is LOSING WORK — it force-removes
      # checkouts and deletes branches, and every path it takes is decided by git
      # state that is tedious to reproduce by hand. The suite is fully hermetic
      # (throwaway repos under $BATS_TEST_TMPDIR, shim gh/lsof, CLAUDE_WT_BASE
      # redirected), so it needs nothing here but git + bats.
      - name: wt worktree-lifecycle tests
        run: bats test/wt.bats
